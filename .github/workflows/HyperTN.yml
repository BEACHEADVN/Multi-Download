name: Auto Find and Upload Latest ROM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  download-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      # ================= MYROM =================
      - name: Run MyROM
        run: |
          bash <<'EOF'
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          STATE_FILE="myrom_uploaded.txt"

          timeout 20s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > log.txt || true
          grep "Processing file" log.txt | grep "\.7z" | grep -i "myrom" > files.txt || true
          [ -s files.txt ] || exit 0

          FILE=$(tail -n 1 files.txt | cut -d' ' -f4-)

          touch $STATE_FILE

          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | cut -d'|' -f2)
            OK=$(curl -s https://pixeldrain.com/api/file/$ID/info | jq -r '.success')
            [ "$OK" = "true" ] && exit 0
          fi

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

          rclone copy source_rom:/ . --include "$FILE" --drive-acknowledge-abuse

          ID=$(curl -u ":${{ secrets.PIXELDRAIN_API_KEY }}" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file | jq -r '.id')

          LINK="https://pixeldrain.com/u/$ID"

          curl -s -X POST \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="<b>🚀 New MyROM Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>" \
          -d parse_mode="HTML"

          sed -i "\|^$FILE|d" "$STATE_FILE"
          echo "$FILE|$ID" >> "$STATE_FILE"
          EOF

      # ================= SOCRATES =================
      - name: Run Socrates
        run: |
          bash <<'EOF'
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          STATE_FILE="socrates_uploaded.txt"

          timeout 20s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > log.txt || true
          grep "Processing file" log.txt | grep "\.7z" | grep -i "socrates" > files.txt || true
          [ -s files.txt ] || exit 0

          FILE=$(tail -n 1 files.txt | cut -d' ' -f4-)

          touch $STATE_FILE

          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | cut -d'|' -f2)
            OK=$(curl -s https://pixeldrain.com/api/file/$ID/info | jq -r '.success')
            [ "$OK" = "true" ] && exit 0
          fi

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

          rclone copy source_rom:/ . --include "$FILE" --drive-acknowledge-abuse

          ID=$(curl -u ":${{ secrets.PIXELDRAIN_API_KEY }}" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file | jq -r '.id')

          LINK="https://pixeldrain.com/u/$ID"

          curl -s -X POST \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="<b>🚀 New Socrates Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>" \
          -d parse_mode="HTML"

          sed -i "\|^$FILE|d" "$STATE_FILE"
          echo "$FILE|$ID" >> "$STATE_FILE"
          EOF

      - name: Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.txt
          git commit -m "Update ROM states" || exit 0
          git pull --rebase origin main
          git push origin main