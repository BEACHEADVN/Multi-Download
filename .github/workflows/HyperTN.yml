name: HyperTN ROM Auto Upload

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  upload-roms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Process ROMs
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          set -e

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"YOUR_REFRESH_TOKEN","expiry":"2000-01-01T00:00:00Z"}'

          touch rom_uploaded.txt

          DEVICES=(
            "Myron|1SigSDil1MVUYeozqGBmXj4thPhfkchXQ"
            "Socrates|1oX7KqbgzmtteFnE_DvUYLa6n3cCTQfLV"
          )

          for ENTRY in "${DEVICES[@]}"; do

            IFS='|' read DEVICE FOLDER_ID <<< "$ENTRY"

            echo "========================="
            echo "Processing $DEVICE"
            echo "========================="

            timeout 30s gdown --folder \
              "https://drive.google.com/drive/folders/$FOLDER_ID" \
              > gdown_log.txt || true

            grep "Processing file" gdown_log.txt | grep "\.7z" > files_list.txt || true

            if [ ! -s files_list.txt ]; then
              echo "No ROM found"
              continue
            fi

            LATEST_LINE=$(tail -n 1 files_list.txt)

            FILE_NAME=$(echo "$LATEST_LINE" | cut -d' ' -f4-)

            echo "Latest: $FILE_NAME"

            SKIP=false

            if grep -Fq "$DEVICE|$FILE_NAME|" rom_uploaded.txt; then

              OLD_ID=$(grep -F "$DEVICE|$FILE_NAME|" rom_uploaded.txt \
                | head -n1 | cut -d'|' -f3)

              RESPONSE=$(curl -s \
                "https://pixeldrain.com/api/file/$OLD_ID/info")

              SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

              if [ "$SUCCESS" = "true" ]; then
                echo "Already uploaded"
                SKIP=true
              fi
            fi

            if [ "$SKIP" = true ]; then
              continue
            fi

            export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

            rclone copy source_rom:/ . \
              --include "$FILE_NAME" \
              --drive-acknowledge-abuse \
              --progress

            ls -lh "$FILE_NAME"

            RESPONSE=$(curl -u ":$PD_API_KEY" \
              -F "file=@${FILE_NAME}" \
              https://pixeldrain.com/api/file)

            PD_ID=$(echo "$RESPONSE" | jq -r '.id')

            if [ "$PD_ID" = "null" ] || [ -z "$PD_ID" ]; then
              echo "Upload failed"
              echo "$RESPONSE"
              exit 1
            fi

            LINK="https://pixeldrain.com/u/$PD_ID"

            TEXT="<b>🚀 New ${DEVICE} ROM Uploaded!</b>%0A%0A📦 <code>$FILE_NAME</code>%0A🔗 <a href=\"$LINK\">Download</a>"

            curl -s -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$TEXT" \
              -d parse_mode="HTML"

            sed -i "\|^$DEVICE|$FILE_NAME|d" rom_uploaded.txt
            echo "$DEVICE|$FILE_NAME|$PD_ID" >> rom_uploaded.txt

            rm -f "$FILE_NAME"

          done

      - name: Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add rom_uploaded.txt
          git commit -m "Update ROM states" || exit 0

          git pull --rebase origin main
          git push
