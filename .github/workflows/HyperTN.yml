name: HyperTN ROM Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  download-rom:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Định nghĩa 2 thiết bị chạy song song độc lập
        device: [Myron, Socrates]
        include:
          - device: Myron
            folder_id: "1SigSDil1MVUYeozqGBmXj4thPhfkchXQ"
          - device: Socrates
            folder_id: "1oX7KqbgzmtteFnE_DvUYLa6n3cCTQfLV"
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      # ===== FIND LATEST ROM (SỬA ĐỊNH DẠNG FORMAT) =====
      - name: Parse Folder and Find Latest
        id: gdrive
        run: |
          set -e
          FOLDER_ID="${{ matrix.folder_id }}"
          
          # Cấu hình nhanh một remote tạm thời để lấy danh sách file chuẩn xác nhất
          export RCLONE_CONFIG_SCAN_TYPE="drive"
          export RCLONE_CONFIG_SCAN_SCOPE="drive"
          export RCLONE_CONFIG_SCAN_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SCAN_ROOT_FOLDER_ID="$FOLDER_ID"

          echo "=== Scan Google Drive folder via Rclone for [${{ matrix.device }}] ==="
          
          # `--format "pi"` xuất ra: tên_file;ID_file hoặc khoảng trắng. 
          # Dùng awk để chuyển đổi chuẩn thành định dạng "Tên_file|ID" nhằm khớp với lệnh cut phía dưới.
          rclone lsf scan:/ --format "pi" | grep "\.7z" | awk '{print $1"|"$2}' | sort > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Không tìm thấy file .7z nào trong thư mục của ${{ matrix.device }}"
            exit 1
          fi

          echo "=== ROM found ==="
          cat files_list.txt
          
          # Lấy dòng cuối cùng (file mới nhất)
          LATEST_LINE=$(tail -n 1 files_list.txt)
          
          # Tách chuỗi ra Tên file và ID file để truyền tiếp xuống các step sau
          FILE_NAME=$(echo "$LATEST_LINE" | cut -d'|' -f1)
          FILE_ID=$(echo "$LATEST_LINE" | cut -d'|' -f2)

          echo "Latest ${{ matrix.device }}: $FILE_NAME"
          echo "id=$FILE_ID"
          
          echo "file=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "id=$FILE_ID" >> $GITHUB_OUTPUT

      # ===== CHECK STATE =====
      - name: Check Uploaded State
        id: check
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          STATE_FILE="rom_uploaded.txt"
          touch "$STATE_FILE"
          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | head -n1 | cut -d'|' -f2)
            RESPONSE=$(curl -s "https://pixeldrain.com/api/file/$ID/info")
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
            if [ "$SUCCESS" = "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "File vẫn tồn tại → skip"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "File mất → upload lại"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "ROM mới → upload"
          fi

      # ===== DOWNLOAD ROM =====
      - name: Download ROM
        if: steps.check.outputs.skip != 'true'
        run: |
          FILE_NAME="${{ steps.gdrive.outputs.file }}"
          FOLDER_ID="${{ matrix.folder_id }}"
          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"
          rclone copy source_rom:/ . \
            --include "$FILE_NAME" \
            --drive-acknowledge-abuse \
            --progress

      # ===== VERIFY =====
      - name: Verify Downloaded File
        if: steps.check.outputs.skip != 'true'
        run: |
          ls -lh "${{ steps.gdrive.outputs.file }}"

      # ===== UPLOAD PIXELDRAIN =====
      - name: Upload to Pixeldrain
        if: steps.check.outputs.skip != 'true'
        id: pd
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          RESPONSE=$(curl -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file)
          ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ "$ID" = "null" ] || [ -z "$ID" ]; then
            echo "Upload failed"
            echo "$RESPONSE"
            exit 1
          fi
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT

      # ===== TELEGRAM =====
      - name: Send Telegram Notification
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          LINK="${{ steps.pd.outputs.link }}"
          TEXT="<b>🚀 New HyperTN [${{ matrix.device }}] Uploaded!</b>%0A%0A📦 File: <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>"
          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      # ===== SAVE STATE =====
      - name: Save State and Push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILE="${{ steps.gdrive.outputs.file }}"
          ID="${{ steps.pd.outputs.id }}"
          STATE_FILE="rom_uploaded.txt"
          
          # Vòng lặp kéo/đẩy tự động rebase chống xung đột khi 2 luồng kết thúc sát giờ nhau
          for i in {1..5}; do
            git pull --rebase origin main || true
            touch "$STATE_FILE"
            sed -i "\|^$FILE|d" "$STATE_FILE"
            echo "$FILE|$ID" >> "$STATE_FILE"
            git add "$STATE_FILE"
            if git commit -m "Update ROM ${{ matrix.device }}: $FILE"; then
              if git push origin main; then
                break
              fi
            else
              break
            fi
            sleep 3
          done
