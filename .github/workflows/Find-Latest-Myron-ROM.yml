name: Get Redmi K90 Pro Max ROM Link

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng muốn lấy link tải (china, eea, global, taiwan, indonesia)'
        required: true
        default: 'china'

jobs:
  get-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decode Partition Base64 Link
        env:
          CHOSEN_REGION: ${{ github.event.inputs.region || 'china' }}
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          REGION_UPPER=$(echo "${{ env.CHOSEN_REGION }}" | tr '[:lower:]' '[:upper:]')
          
          echo "==> Bước 1: Tải giao diện trang chủ..."
          curl -s -L -H "User-Agent: $USER_AGENT" "$TARGET_URL" > main.html

          # Xác định mã định danh phân vùng
          if [ "${{ env.CHOSEN_REGION }}" = "china" ]; then
              REG_KEY="WPMCNXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "eea" ] || [ "${{ env.CHOSEN_REGION }}" = "europe" ]; then
              REG_KEY="WPMEUXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "taiwan" ]; then
              REG_KEY="WPMTWXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "indonesia" ]; then
              REG_KEY="WPMIDXM"
          else
              REG_KEY="WPMMIXM"
          fi

          echo "==> Bước 2: Cô lập block HTML chứa mã vùng $REG_KEY..."
          
          # Cắt một khối nhỏ gồm dòng chứa mã vùng và 8 dòng tiếp theo để triệt tiêu việc nhận nhầm sang vùng khác
          # Sau đó bốc chuỗi Base64 (bắt đầu bằng aHR0c) duy nhất nằm trong khối này
          BASE64_STR=$(grep -A 8 "$REG_KEY" main.html | grep -oE 'aHR0cH[a-zA-Z0-9+=]+' | head -n 1)

          if [ -z "$BASE64_STR" ]; then
              echo "❌ Thất bại: Không tìm thấy chuỗi mã hóa ẩn của phân vùng này."
              exit 1
          fi

          # Giải mã chuỗi Base64 để lấy link trang chuyển tiếp của miuirom.org
          DECODED_URL=$(echo "$BASE64_STR" | base64 -d 2>/dev/null)
          echo "🔗 Link trang chuyển tiếp bốc được: $DECODED_URL"

          echo "==> Bước 3: Truy cập link chuyển tiếp lấy link tải chính thức..."
          # Trang chuyển tiếp này thực tế sẽ ghi nhận yêu cầu và trả về code có chứa link trực tiếp bigota/hugeota
          DOWNLOAD_PAGE=$(curl -s -L -H "User-Agent: $USER_AGENT" "$DECODED_URL")

          # Quét tìm liên kết tải chính thức .zip của Xiaomi
          DIRECT_LINK=$(echo "$DOWNLOAD_PAGE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.zip' | sort -u | head -n 1)

          # Nếu trang chuyển tiếp vẫn giấu link, ta ép thẳng qua API Xiaomi bằng tham số trần (không bọc chữ OS)
          if [ -z "$DIRECT_LINK" ]; then
              echo "⚠️ Link vẫn bị giấu mã hóa sâu. Đang chuyển sang kích hoạt API Xiaomi với mã gốc..."
              FULL_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[A-Z]+' main.html | grep "$REG_KEY" | head -n 1)
              
              # Thử nghiệm cấu hình payload chuẩn không chứa ký tự dư thừa
              API_URL="https://update.miui.com/updates/v1/fullrom.php"
              PAYLOAD="d=myron&v=${FULL_VERSION}&b=F&r=${REG_KEY:3:2}&l=en_US&n=NONE"
              
              RESPONSE=$(curl -s -X POST "$API_URL" -H "Content-Type: application/x-www-form-urlencoded" -d "$PAYLOAD")
              DIRECT_LINK=$(echo "$RESPONSE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.zip' | head -n 1)
          fi

          echo "=================================================="
          echo " DOWNLOAD LINK FOR $REGION_UPPER"
          echo "=================================================="
          if [ -z "$DIRECT_LINK" ]; then
              echo "❌ Hệ thống chưa tìm thấy link tải gói (.zip) toàn vẹn cho phiên bản này."
              echo "Nguyên nhân: Bản build này có thể đang ở dạng nội bộ (Beta/Stable Beta) nên Xiaomi chưa đẩy lên CDN công khai công nghiệp."
          else
              echo "Mã phiên bản: $REG_KEY"
              echo "Đường link tải trực tiếp:"
              echo "$DIRECT_LINK"
          fi
          echo "=================================================="
