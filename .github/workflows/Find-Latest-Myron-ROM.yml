name: Find Latest Myron ROM

on:
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng ROM (China, Europe, Global, India)'
        required: true
        default: 'Europe'

  # Cấu hình chạy tự động định kỳ (Mặc định: 6 tiếng check 1 lần)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest ROM Link via Community API
        env:
          REGION_INPUT: ${{ github.event.inputs.region || 'Europe' }}
        run: |
          DEVICE="myron"
          
          # Chuẩn hóa tên phân vùng theo chuẩn dữ liệu của API Quốc tế
          if [ "$REGION_INPUT" = "EEA" ] || [ "$REGION_INPUT" = "Europe" ]; then
              REGION="Europe"
          elif [ "$REGION_INPUT" = "CN" ] || [ "$REGION_INPUT" = "China" ]; then
              REGION="China"
          elif [ "$REGION_INPUT" = "GL" ] || [ "$REGION_INPUT" = "Global" ]; then
              REGION="Global"
          else
              REGION="$REGION_INPUT"
          fi

          echo "==> System: Fetching latest stable ROM for $DEVICE ($REGION) from community tracker..."
          
          # Gọi trực tiếp vào API công khai của Xiaomi Firmware Updater chuyên cho thiết bị cụ thể
          RESPONSE=$(curl -s "https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery/stable_recovery.json")

          if [ -z "$RESPONSE" ]; then
              echo "❌ Error: Không thể kết nối tới cơ sở dữ liệu Tracker."
              exit 1
          fi

          # Dùng jq để lọc bản dựng mới nhất khớp với codename và phân vùng
          DATA_FILTERED=$(echo "$RESPONSE" | jq --arg dev "$DEVICE" --arg reg "$REGION" '.[] | select(.codename == $dev and .region == $reg)')

          echo "=================================================="
          echo " TRACKER RESPONDED SUCCESSFULLY"
          echo "=================================================="

          if [ -z "$DATA_FILTERED" ]; then
              echo " [Thông báo] Không tìm thấy dữ liệu ROM khớp với thiết bị $DEVICE ở phân vùng $REGION."
              echo " Có thể bản ROM này quá mới và đang được hệ thống cập nhật vào database."
          else
              # Lấy thông tin bản ghi mới nhất (dòng đầu tiên)
              VERSION=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .version')
              FILENAME=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .filename')
              LINK=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .download')
              android_version=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .android')

              echo " FOUND LATEST STABLE ROM FOR ${DEVICE^^}"
              echo "--------------------------------------------------"
              echo "Version:         $VERSION"
              echo "Android Version: $android_version"
              echo "Filename:        $FILENAME"
              echo "Download Link:   $LINK"
          fi
          echo "=================================================="
