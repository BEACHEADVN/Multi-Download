name: Test China Version

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install beautifulsoup4 requests

      - name: Download page
        run: |
          curl -L \
            "https://miuirom.org/phones/redmi-k90-pro-max#China" \
            -o phone_page.html

      - name: Extract China Version
        run: |
          python << 'EOF'
          import re
          from bs4 import BeautifulSoup

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html = f.read()

          text = BeautifulSoup(html, "html.parser").get_text("\n")

          print("=== DEBUG ===")
          print("China found:", "China" in text)
          print("Version found:", "Version" in text)

          m = re.search(
              r'China(.*?)Europe',
              text,
              re.S
          )

          if not m:
              raise Exception("Không tìm thấy block China")

          china_block = m.group(1)

          print("\n=== CHINA BLOCK ===")
          print(china_block[:2000])

          v = re.search(
              r'Version\s+([^\s]+)',
              china_block
          )

          if not v:
              raise Exception("Không tìm thấy Version")

          print("\n=== RESULT ===")
          print(v.group(1))
          EOF
