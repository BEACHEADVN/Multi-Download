name: Find Latest Myron ROM

on:
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng ROM (CN, GL, EEA)'
        required: true
        default: 'EEA'

  # Cấu hình chạy tự động định kỳ (Mặc định: 6 tiếng check 1 lần)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Latest ROM Link
        env:
          REGION: ${{ github.event.inputs.region || 'EEA' }}
        run: |
          python -c "
          import requests
          import json

          device = 'myron'
          region = '${{ env.REGION }}'
          
          # Cấu hình đúng mã định danh thiết bị 'PM' bóc tách từ link gốc của bạn
          if region == 'EEA':
              version = 'OS3.0.301.0.WPMEUXM'
          elif region == 'CN':
              version = 'OS3.0.301.0.WPMCNXM'
          else:
              version = 'OS3.0.301.0.WPMMIXM'
          
          url = 'https://update.miui.com/updates/v1/fullrom.php'
          
          payload = {
              'd': device,
              'v': version,
              'b': 'F',
              'r': region,
              'l': 'en_US',
              'n': 'NONE'
          }
          
          print(f'==> System: Requesting update for {device} ({region}) using valid base {version}...')
          
          try:
              headers = {
                  'User-Agent': 'MiuiUpdater-App',
                  'Content-Type': 'application/x-www-form-urlencoded'
              }
              
              # Dùng POST request truyền data chuẩn
              response = requests.post(url, data=payload, headers=headers, timeout=15)
              
              if response.status_code == 200:
                  # Đôi khi nếu không có bản mới hơn, server Xiaomi trả về chuỗi văn bản trống hoặc JSON rỗng
                  if response.text.strip():
                      try:
                          data = response.json()
                          if 'CurrentRom' in data:
                              rom_info = data['CurrentRom']
                              print('\n==================================================')
                              print(f' FOUND LATEST ROM FOR {device.upper()}')
                              print('==================================================')
                              print(f'Version: {rom_info.get(\"Version\", \"N/A\")}')
                              print(f'Filename: {rom_info.get(\"Filename\", \"N/A\")}')
                              print(f'MD5: {rom_info.get(\"MD5\", \"N/A\")}')
                              print(f'Download Link: {rom_info.get(\"Link\", \"N/A\")}')
                              print('==================================================\n')
                          else:
                              print('\n [Mới Nhất] Không có bản cập nhật nào mới hơn bản base này.')
                              print('Response Data:', json.dumps(data, indent=2))
                      except json.JSONDecodeError:
                          print('❌ Error: Server returned non-JSON response:', response.text)
                  else:
                      print('\n [Mới Nhất] Server trả về rỗng, chứng tỏ bản base của bạn hiện là mới nhất.')
              else:
                  print(f'❌ Error: Server returned status code {response.status_code}')
                  print('Response Text:', response.text)
          except Exception as e:
              print(f'❌ Request failed: {str(e)}')
          "
