name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Trích xuất tên phiên bản ROM thật từ giao diện chính xác
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          
          # Từ khóa hiển thị trên giao diện của trang web
          region_keyword = "China" if target_region == "China" else "Europe"
          
          print(f"--- Đang trích xuất tên phiên bản ROM thật cho vùng: {target_region} ({region_keyword}) ---")

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          # Chiến thuật: Tìm text "China" hoặc "Europe" trước
          # Phiên bản ROM thật (thẻ <a>) chính là thẻ <a> gần nhất nằm ngay phía sau hoặc bên trong khối đó
          all_links = soup.find_all('a')
          
          # Cách 1: Quét tìm dựa theo định dạng text của mã build HyperOS 3 (Bắt đầu bằng 3.0. và có đuôi ký tự vùng)
          for link in all_links:
              text = link.get_text(strip=True)
              # Kiểm tra cấu trúc mã build (ví dụ: 3.0.306.0.WPMCNXM)
              if text.startswith("3.0."):
                  if target_region == "China" and "CNXM" in text:
                      version_code = text
                      break
                  elif target_region == "EEA" and "EUXM" in text:
                      version_code = text
                      break

          # Cách 2: Dự phòng nếu cấu trúc HTML bao bọc phức tạp (Quét thẻ cha chứa chữ)
          if not version_code:
              for item in soup.find_all(['li', 'div']):
                  item_text = item.get_text()
                  if region_keyword in item_text and "3.0." in item_text:
                      # Tìm thẻ a nằm trong block này
                      inner_link = item.find('a')
                      if inner_link:
                          link_text = inner_link.get_text(strip=True)
                          if link_text.startswith("3.0."):
                              version_code = link_text
                              break

          if not version_code:
              print(f"[THẤT BẠI] Không tìm thấy chuỗi phiên bản dạng 3.0.x.x cho vùng {target_region} trên giao diện web.")
              sys.exit(1)

          print(f"\n[KẾT QUẢ TRÍCH XUẤT TỪ ẢNH MÀN HÌNH]")
          print(f"-> Vùng: {target_region}")
          print(f"-> Mã phiên bản ROM thật: {version_code}\n")

          # Lưu lại biến môi trường
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
