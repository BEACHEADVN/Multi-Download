name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Dọn dẹp tệp tin trạng thái cũ
        run: |
          # Xóa sạch các file text rác nếu có trước khi tải
          rm -f *_state.txt *.txt

      - name: Cào dữ liệu và phân tích URL Aliyun Tốc Độ Cao
        id: scraper
        run: |
          python - <<EOF
          import requests
          from bs4 import BeautifulSoup
          import os
          import re

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }
          
          base_url = "https://hyperosroms.com"
          model_url = f"{base_url}/model/myron"
          
          # Lấy thông tin khu vực từ Matrix của GitHub Action
          target_region = "${{ matrix.region }}"
          target_type = "recovery"
          
          print(f"Đang quét trang tổng hợp: {model_url}")
          print(f"Mục tiêu luồng matrix hiện tại: Region=[{target_region}], Type=[{target_type}]")
          
          res = requests.get(model_url, headers=headers, timeout=15)
          if res.status_code != 200:
              print("Không thể truy cập trang chủ model Myron")
              exit(1)
              
          soup = BeautifulSoup(res.text, 'html.parser')
          rows = soup.find_all('tr')
          sub_page_url = ""

          for row in rows:
              cells = row.find_all('td')
              if len(cells) >= 5:
                  region_text = cells[1].get_text(strip=True)
                  type_text = cells[2].get_text(strip=True).lower()
                  
                  # Khớp chính xác vùng (China hoặc EEA) từ matrix
                  if region_text == target_region and type_text == target_type:
                      link_tag = cells[0].find('a') or cells[-1].find('a')
                      if link_tag and 'href' in link_tag.attrs:
                          sub_page_url = base_url + link_tag['href'] if link_tag['href'].startswith('/') else link_tag['href']
                          break

          if not sub_page_url:
              print(f"Không tìm thấy phiên bản phù hợp cho vùng {target_region}.")
              exit(1)

          print(f"Đang quét trang chi tiết: {sub_page_url}")
          res_sub = requests.get(sub_page_url, headers=headers, timeout=15)
          soup_sub = BeautifulSoup(res_sub.text, 'html.parser')
          
          package_name = ""
          for li in soup_sub.find_all(['li', 'p']):
              text = li.get_text()
              if "Package Name:" in text:
                  package_name = text.split("Package Name:")[-1].strip()
                  break
                  
          if not package_name:
              match = re.search(r'([\w-]+\.zip)', res_sub.text)
              if match:
                  package_name = match.group(1)

          if not package_name:
              print("Không thể trích xuất Package Name từ trang chi tiết.")
              exit(1)

          version_code = sub_page_url.split('/')[-1]
          
          # Ghép chuỗi tạo link máy chủ Aliyun Singapore tốc độ cao
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"[THÀNH CÔNG] Sinh link tốc độ cao: {final_download_url}")
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
