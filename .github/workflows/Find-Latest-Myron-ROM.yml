name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện bổ trợ
        run: pip install beautifulsoup4 requests

      - name: Trích xuất tên phiên bản ROM và khớp chuỗi Hash
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          
          print(f"--- Đang lấy phiên bản cho vùng: {target_region} ---")

          # Đọc file HTML tổng đã tải bằng curl ở bước trước
          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          # Tìm chính xác mã build dựa vào thẻ <a> chứa chuỗi "3.0."
          all_links = soup.find_all('a')
          for link in all_links:
              text = link.get_text(strip=True)
              if text.startswith("3.0."):
                  if target_region == "China" and "CNXM" in text:
                      version_code = text
                      break
                  elif target_region == "EEA" and "EUXM" in text:
                      version_code = text
                      break

          if not version_code:
              print(f"[THẤT BẠI] Không tìm thấy phiên bản phù hợp cho {target_region}")
              sys.exit(1)

          # Khớp định dạng tên file và hash theo từng vùng
          if target_region == "China":
              hash_code = "0b34ee6a73"
              package_name = f"myron-ota_full-OS{version_code}-user-16.0-{hash_code}.zip"
          else:
              # Cho bản EEA (thay hash tương ứng của EEA vào đây khi có)
              hash_code = "eea1234567" 
              package_name = f"myron-ota_full-OS{version_code}-user-16.0-{hash_code}.zip"

          # Dựng đường dẫn lưu trữ Aliyun của bạn
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS{version_code}/{package_name}"
          
          print(f"\n[KẾT QUẢ ĐÃ KHỚP CHUẨN]")
          print(f"-> Phiên bản: OS{version_code}")
          print(f"-> Hash: {hash_code}")
          print(f"-> File name: {package_name}")
          print(f"-> Link Aliyun: {final_download_url}\n")

          # Ghi vào biến môi trường GitHub
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION=OS{version_code}\n")
          EOF

