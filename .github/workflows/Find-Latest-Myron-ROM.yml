name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy dữ liệu ROM thật từ Server OTA Xiaomi
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os
          import sys

          target_region = "${{ matrix.region }}"
          
          # Đặt mã máy (codename) cho Redmi K90 Pro Max / POCO F8 Ultra
          device_code = "myron"
          
          # Mã khu vực: CN cho China, EU cho EEA Global
          region_code = "CN" if target_region == "China" else "EU"
          
          # Cổng API check OTA chính thức của Xiaomi
          api_url = f"https://update.miui.com/updates/v1/g_latest_version.php?d={device_code}&b=F&r={region_code}&n=1"
          
          print(f"--- Đang truy vấn trực tiếp Server OTA Xiaomi ({target_region}) ---")
          print(f"URL: {api_url}")
          
          headers = {
              "User-Agent": "MiuiBrowser/12.12.1"
          }

          try:
              res = requests.get(api_url, headers=headers, timeout=15)
              res.raise_for_status()
              
              # Nếu không có dữ liệu hoặc trả về trống
              if not res.text.strip():
                  print(f"[THẤT BẠI] Server Xiaomi không trả về dữ liệu ROM nào cho {device_code} ({target_region}).")
                  sys.exit(1)
                  
              data = res.json()
              
              # Phân tích cấu trúc dữ liệu trả về từ Xiaomi
              if "LatestRom" in data:
                  rom_info = data["LatestRom"]
                  package_name = rom_info.get("filename")
                  version_code = rom_info.get("version")
              else:
                  print(f"[THẤT BẠI] Thiết bị chưa có ROM Public trên server OTA của Xiaomi.")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"[LỖI HỆ THỐNG] Không thể kết nối hoặc phân tích cú pháp từ Xiaomi: {e}")
              sys.exit(1)

          if not package_name or not version_code:
              print("[LỖI] Dữ liệu tên file hoặc phiên bản trả về bị trống.")
              sys.exit(1)

          # Sinh link tải tốc độ cao Aliyun từ dữ liệu thật vừa lấy được
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"\n[THÀNH CÔNG RỰC RỠ]")
          print(f"-> Version thật: {version_code}")
          print(f"-> File name thật: {package_name}")
          print(f"-> Link Aliyun: {final_download_url}\n")
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
