name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện BeautifulSoup
        run: pip install beautifulsoup4 requests

      - name: Tải mã nguồn trang web bằng curl
        run: |
          # Tải toàn bộ nội dung trang web về máy ảo
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
               -H "Accept: text/html" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          if [ ! -s phone_page.html ]; then
            echo "[LỖI] Không thể tải được dữ liệu từ miuirom.org!"
            exit 1
          fi

      - name: Trích xuất mã ROM từ block Neo chỉ định
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          
          # Định vị ID block theo vùng: 'China' hoặc 'EEA'
          target_id = "China" if target_region == "China" else "EEA"
          
          print(f"--- Đang truy quét trực tiếp tại vùng Neo: #{target_id} ---")

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          # Bước 1: Tìm block div hoặc section có id cụ thể (#China hoặc #EEA)
          region_block = soup.find(id=target_id)
          
          if region_block:
              # Bước 2: Quét toàn bộ các thẻ liên kết <a> nằm bên trong block vùng này
              links = region_block.find_all('a')
              for link in links:
                  text = link.get_text(strip=True)
                  # Nhận diện chính xác mã build HyperOS 3 (Ví dụ: 3.0.306.0.WPMCNXM)
                  if text.startswith("3.0."):
                      if target_region == "China" and "CNXM" in text:
                          version_code = text
                          break
                      elif target_region == "EEA" and "EUXM" in text:
                          version_code = text
                          break

          # Phòng hờ trường hợp ID nằm ở cấu trúc thẻ khác, quét fallback diện rộng theo danh mục màu xanh
          if not version_code:
              all_links = soup.find_all('a')
              for link in all_links:
                  text = link.get_text(strip=True)
                  if text.startswith("3.0."):
                      if target_region == "China" and "CNXM" in text:
                          version_code = text
                          break
                      elif target_region == "EEA" and "EUXM" in text:
                          version_code = text
                          break

          if not version_code:
              print(f"[THẤT BẠI] Không tìm thấy mã phiên bản HyperOS 3 cho vùng {target_region}.")
              sys.exit(1)

          print(f"\n[XÁC THỰC THÀNH CÔNG]")
          print(f"-> Vùng: {target_region}")
          print(f"-> Mã ROM trích xuất: {version_code}\n")

          # Đẩy vào biến môi trường GitHub để dùng cho các bước đóng gói sau này
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
