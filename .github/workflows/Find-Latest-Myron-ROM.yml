name: Scrape MiuiRom Org List

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scrape Page Data
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          echo "==> System: Connecting to $TARGET_URL..."
          
          # 1. Tải mã nguồn HTML về file tạm
          curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$TARGET_URL" > source.html
          
          if [ ! -s source.html ]; then
              echo "❌ Error: Không tải được dữ liệu từ miuirom.org"
              exit 1
          fi

          echo "=================================================="
          echo " LATEST FIRMWARE UPDATES (MIUIROM.ORG)"
          echo "=================================================="

          # 2. Bóc tách toàn bộ các chuỗi mã build ROM xuất hiện trong trang (Ví dụ: 3.0.13.0.WPMMIXM)
          # Định dạng: Số.Số.Số.Số.KýTựViếtHoa
          MAP_VERSIONS=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[A-Z]+' source.html)

          if [ -z "$MAP_VERSIONS" ]; then
              echo "❌ Không tìm thấy chuỗi mã phiên bản nào trên trang."
              echo "Có thể cấu trúc HTML đã thay đổi. Log thử 50 dòng chứa chữ WP để check:"
              grep -i "WPM" source.html | head -n 50
              exit 0
          fi

          # 3. Đọc từng dòng phiên bản tìm được và gán tương ứng theo thứ tự hiển thị trong ảnh
          echo "$MAP_VERSIONS" | {
              read -r GLOBAL_VER
              read -r EUROPE_VER
              read -r CHINA_VER
              read -r INDONESIA_VER
              read -r TAIWAN_VER

              printf "📍 %-12s : HyperOS %s\n" "Global" "${GLOBAL_VER:-N/A}"
              printf "📍 %-12s : HyperOS %s\n" "Europe" "${EUROPE_VER:-N/A}"
              printf "📍 %-12s : HyperOS %s\n" "China" "${CHINA_VER:-N/A}"
              printf "📍 %-12s : HyperOS %s\n" "Indonesia" "${INDONESIA_VER:-N/A}"
              printf "📍 %-12s : HyperOS %s\n" "Taiwan" "${TAIWAN_VER:-N/A}"
          }
          echo "=================================================="
