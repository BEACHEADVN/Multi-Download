name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy link ROM từ API Xiaomi OTA
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os

          # Map tên vùng từ matrix sang mã vùng của Xiaomi
          region_map = {
              "China": "CN",
              "EEA": "EEA"
          }
          
          target_region = "${{ matrix.region }}"
          device_code = "myron" # Mã máy của Redmi K70 Ultra / 14T Pro
          rom_region = region_map.get(target_region, "CN")

          # Sử dụng API công khai chính thức để lấy thông tin ROM
          api_url = f"https://romapi.fds-dev.workers.dev/api/v1/device/{device_code}/stable"
          
          print(f"Đang gọi API: {api_url} cho vùng {target_region} ({rom_region})")
          
          try:
              res = requests.get(api_url, timeout=15)
              res.raise_for_status()
              data = res.json()
              
              # Tìm bản nâng cấp Recovery phù hợp với vùng
              rom_info = None
              for rom in data.get("branches", []):
                  if rom.get("region") == rom_region and rom.get("type") == "recovery":
                      rom_info = rom
                      break
                      
              if not rom_info:
                  print(f"Không tìm thấy bản ROM Recovery nào cho vùng {target_region}")
                  exit(1)
                  
              package_name = rom_info.get("filename")
              version_code = rom_info.get("version")
              
              # Ghép chuỗi tạo link máy chủ Aliyun Singapore tốc độ cao như cũ
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              
              print(f"[THÀNH CÔNG] Sinh link tốc độ cao: {final_download_url}")
              
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
                  
          except Exception as e:
              print(f"Lỗi khi gọi API: {e}")
              exit(1)
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
