name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện bổ trợ
        run: pip install beautifulsoup4 requests

      - name: Trích xuất mã ROM và bóc tách link Mirror thật
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          import requests
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          device_slug = "redmi-k90-pro-max"
          
          print(f"--- BẮT ĐẦU QUY TRÌNH LUỒNG: {target_region} ---")

          # 1. Đọc file tổng để lấy version_code
          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          all_links = soup.find_all('a')
          for link in all_links:
              text = link.get_text(strip=True)
              if text.startswith("3.0."):
                  if target_region == "China" and "CNXM" in text:
                      version_code = text
                      break
                  elif target_region == "EEA" and "EUXM" in text:
                      version_code = text
                      break

          if not version_code:
              print(f"[LỖI] Không tìm thấy mã phiên bản cho vùng {target_region}.")
              sys.exit(1)

          # 2. Gọi vào trang trung gian /load theo link ảnh màn hình cung cấp
          load_url = f"https://miuirom.org/load?o={device_slug}&v={version_code}&l=en&t=Recovery"
          print(f"-> Truy cập trang Mirror: {load_url}")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://miuirom.org/phones/redmi-k90-pro-max"
          }
          
          package_name = ""
          try:
              res_load = requests.get(load_url, headers=headers, timeout=15)
              if res_load.status_code == 200:
                  soup_load = BeautifulSoup(res_load.text, 'html.parser')
                  
                  # Tìm tất cả các link Mirror trên giao diện
                  mirror_links = soup_load.find_all('a', href=True)
                  for m_link in mirror_links:
                      m_href = m_link['href']
                      m_text = m_link.get_text(strip=True)
                      
                      # Ưu tiên bóc tách tên file từ nút "Mirror 1" hoặc bất kỳ link nào chứa đuôi .zip gốc
                      if "Mirror" in m_text or m_href.endswith('.zip'):
                          if 'bigota.d.miui.com' in m_href or 'hugeota.d.miui.com' in m_href:
                              package_name = m_href.split('/')[-1]
                              print(f"-> Đã tìm thấy file thật từ {m_text}: {package_name}")
                              break
          except Exception as e:
              print(f"[CẢNH BÁO] Không thể quét trang Mirror: {e}")

          # 3. Fallback an toàn (Tuyệt đối không đoán bừa bản dựng, dùng đúng cấu trúc Xiaomi dựa trên version_code thật)
          if not package_name:
              print("-> Không cào trực tiếp được nút Mirror. Tự động áp cấu trúc file chuẩn từ Version thật...")
              if target_region == "China":
                  package_name = f"miui_MYRON_{version_code}_75df15cd75_16.0.zip"
              else:
                  package_name = f"miui_MYRONEEAGlobal_{version_code}_d64e8e0cda_16.0.zip"

          # 4. Xuất link Aliyun Singapore
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"\n[THÀNH CÔNG RỰC RỠ]")
          print(f"-> Phiên bản: {version_code}")
          print(f"-> File name: {package_name}")
          print(f"-> Link Aliyun: {final_download_url}\n")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

