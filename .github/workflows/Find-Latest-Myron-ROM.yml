name: Get China ROM Download Link

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng muốn lấy link tải (china, eea, global, taiwan, indonesia)'
        required: true
        default: 'china'

jobs:
  get-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scrape and Decode Base64 Link
        env:
          CHOSEN_REGION: ${{ github.event.inputs.region || 'china' }}
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          REGION_UPPER=$(echo "${{ env.CHOSEN_REGION }}" | tr '[:lower:]' '[:upper:]')
          
          echo "==> Bước 1: Tải giao diện trang chủ thiết bị..."
          curl -s -L -H "User-Agent: $USER_AGENT" "$TARGET_URL" > main.html

          # Định nghĩa mã định danh phân vùng cần tìm trong chuỗi HTML
          if [ "${{ env.CHOSEN_REGION }}" = "china" ]; then
              REG_KEY="WPMCNXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "eea" ] || [ "${{ env.CHOSEN_REGION }}" = "europe" ]; then
              REG_KEY="WPMEUXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "taiwan" ]; then
              REG_KEY="WPMTWXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "indonesia" ]; then
              REG_KEY="WPMIDXM"
          else
              REG_KEY="WPMMIXM"
          fi

          echo "==> Bước 2: Tìm và giải mã chuỗi Base64 tương ứng với phân vùng: $REGION_UPPER ($REG_KEY)..."
          
          # Quét tìm dòng chứa mã build cụ thể của phân vùng, bốc chuỗi Base64 nằm trong block đó
          # Chuỗi mã hóa Base64 của miuirom thường bắt đầu bằng 'aHR0cH' (mã hóa của 'http')
          BASE64_STR=$(grep -A 5 "$REG_KEY" main.html | grep -oE 'aHR0cHM2[a-zA-Z0-9+=]+|aHR0cH[a-zA-Z0-9+=]+' | head -n 1)

          # Nếu không tìm thấy bằng mã ROM, thử quét tìm theo cụm text thường bao quanh
          if [ -z "$BASE64_STR" ]; then
              BASE64_STR=$(grep -B 3 -A 10 "href=" main.html | grep "$REG_KEY" | grep -oE 'aHR0cH[a-zA-Z0-9+=]+' | head -n 1)
          fi

          if [ -z "$BASE64_STR" ]; then
              echo "❌ Thất bại: Không tìm thấy chuỗi mã hóa Base64 cho phân vùng này."
              echo "==> DEBUG: Lọc thử cấu trúc chứa mã ROM để kiểm tra:"
              grep -n -C 3 "$REG_KEY" main.html | head -n 20
              exit 1
          fi

          # Tiến hành giải mã chuỗi Base64 sang URL thật bằng core-utils của Linux
          DOWNLOAD_PAGE_URL=$(echo "$BASE64_STR" | base64 -d 2>/dev/null)
          
          if [ -z "$DOWNLOAD_PAGE_URL" ] || [[ ! "$DOWNLOAD_PAGE_URL" =~ http ]]; then
              echo "❌ Thất bại: Chuỗi bốc được không phải Base64 hợp lệ hoặc giải mã sai."
              echo "Chuỗi thô tìm thấy: $BASE64_STR"
              exit 1
          fi

          echo "🔗 Giải mã link ẩn thành công! Trang con mục tiêu: $DOWNLOAD_PAGE_URL"

          echo "==> Bước 3: Truy cập vào trang tải con để bóc link gốc từ Xiaomi..."
          curl -s -L -H "User-Agent: $USER_AGENT" "$DOWNLOAD_PAGE_URL" > download_page.html

          # Lọc lấy link download trực tiếp dạng .zip hoặc .tgz
          FINAL_DOWNLOAD_LINKS=$(grep -oE 'https://[a-zA-Z0-9./_-]+.(zip|tgz)' download_page.html | sort -u)

          echo "=================================================="
          echo " RESULT FOR YOUR SELECTION: $REGION_UPPER"
          echo "=================================================="
          if [ -z "$FINAL_DOWNLOAD_LINKS" ]; then
              echo "⚠️ Chú ý: Đã giải mã vào được trang con, nhưng link trực tiếp đang bị ẩn sau nút bấm."
              echo "Log thử các URL tìm thấy trong trang con để bạn check:"
              grep -oE 'href="[^"]+"' download_page.html | head -n 20
          else
              echo "Tìm thấy các link tải chính thức dưới đây:"
              echo "--------------------------------------------------"
              echo "$FINAL_DOWNLOAD_LINKS"
          fi
          echo "=================================================="
