name: HyperOS Scraper

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        region:
          - China
          - EEA

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Download page
        run: |
          curl -L \
            "https://miuirom.org/phones/redmi-k90-pro-max" \
            -o phone_page.html

      - name: Extract ROM
        shell: bash
        run: |
          python <<'EOF'
          import re
          import requests
          from bs4 import BeautifulSoup

          REGION = "${{ matrix.region }}"

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html = f.read()

          soup = BeautifulSoup(html, "html.parser")

          keyword = "CNXM" if REGION == "China" else "EUXM"

          urls = []

          for a in soup.find_all("a", href=True):
              href = a["href"]

              if keyword in href:
                  urls.append(href)

          print("Found URLs:")
          for u in urls:
              print(u)

          if not urls:
              raise Exception(f"Không tìm thấy ROM {REGION}")
          EOF
