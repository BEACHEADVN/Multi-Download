name: Find Latest Myron ROM

on:
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng ROM (China, Europe, Global, India)'
        required: true
        default: 'Europe'

  # Cấu hình chạy tự động định kỳ (Mặc định: 6 tiếng check 1 lần)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest ROM Link via Community API
        env:
          REGION_INPUT: ${{ github.event.inputs.region || 'Europe' }}
        run: |
          DEVICE="myron"
          
          # Chuẩn hóa tên phân vùng theo chuẩn dữ liệu của Tracker quốc tế
          if [ "$REGION_INPUT" = "EEA" ] || [ "$REGION_INPUT" = "Europe" ]; then
              REGION="Europe"
          elif [ "$REGION_INPUT" = "CN" ] || [ "$REGION_INPUT" = "China" ]; then
              REGION="China"
          elif [ "$REGION_INPUT" = "GL" ] || [ "$REGION_INPUT" = "Global" ]; then
              REGION="Global"
          else
              REGION="$REGION_INPUT"
          fi

          echo "==> System: Fetching latest stable ROM for $DEVICE ($REGION) from device specific tracker..."
          
          # Tải trực tiếp file dữ liệu JSON được tách riêng cho dòng máy myron để tránh lỗi parse lỗi file tổng
          URL_API="https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery/${DEVICE}.json"
          RESPONSE=$(curl -s "$URL_API")

          # Kiểm tra nếu file thiết bị chưa tồn tại trên repo (Ví dụ do máy quá mới chưa được nạp dữ liệu riêng)
          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | grep -q "404: Not Found"; then
              echo "⚠️ Warning: Không tìm thấy cơ sở dữ liệu riêng của $DEVICE. Đang thử chuyển hướng về kho tổng..."
              RESPONSE=$(curl -s "https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery/stable_recovery.json")
              # Ép kiểu dữ liệu an toàn để jq không bị crash
              DATA_FILTERED=$(echo "$RESPONSE" | jq -r --arg reg "$REGION" '.[] | select(.region == $reg)')
          else
              # Lọc dữ liệu theo phân vùng từ file JSON riêng của myron
              DATA_FILTERED=$(echo "$RESPONSE" | jq -r --arg reg "$REGION" '.[] | select(.region == $reg)')
          fi

          echo "=================================================="
          echo " TRACKER RESPONDED SUCCESSFULLY"
          echo "=================================================="

          if [ -z "$DATA_FILTERED" ] || [ "$DATA_FILTERED" = "null" ]; then
              echo " [Thông báo] Hiện chưa có dữ liệu ROM bản Stable cho $DEVICE thuộc phân vùng $REGION."
              echo " Dòng máy này chạy Android 16 rất mới, hãy kiểm tra lại phân vùng China (CN) xem đã có chưa nhé."
          else
              # Trích xuất thông tin bản dựng mới nhất dựa trên logic so sánh phiên bản của jq
              VERSION=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .version')
              FILENAME=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .filename')
              LINK=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .download')
              ANDROID_VER=$(echo "$DATA_FILTERED" | jq -r -s 'max_by(.version) | .android')

              echo " FOUND LATEST STABLE ROM FOR ${DEVICE^^}"
              echo "--------------------------------------------------"
              echo "Version:         $VERSION"
              echo "Android Version: $ANDROID_VER"
              echo "Filename:        $FILENAME"
              echo "Download Link:   $LINK"
          fi
          echo "=================================================="
