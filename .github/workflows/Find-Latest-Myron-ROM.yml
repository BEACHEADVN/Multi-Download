name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy dữ liệu ROM thật từ API Tổng Xiaomi Firmware Updater
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os
          import sys

          target_region = "${{ matrix.region }}"
          
          # Đặt mã máy (codename)
          device_code = "myron"
          
          # Gọi file JSON tổng hợp tất cả các thiết bị Stable Recovery của XiaomiFirmwareUpdater
          api_url = "https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery.json"
          
          print(f"--- Đang truy xuất dữ liệu thật từ API Tổng cho: {device_code} ({target_region}) ---")
          
          try:
              res = requests.get(api_url, timeout=20)
              res.raise_for_status()
              data = res.json()
          except Exception as e:
              print(f"[LỖI] Không thể tải dữ liệu JSON từ GitHub: {e}")
              sys.exit(1)
              
          package_name = ""
          version_code = ""
          
          # Duyệt tìm bản ROM tương ứng trong file JSON tổng
          for item in data:
              # Lọc đúng codename 'myron'
              if item.get("codename", "").lower() == device_code:
                  download_link = item.get("link", item.get("url", ""))
                  filename = download_link.split("/")[-1] if download_link else ""
                  
                  if filename.endswith(".zip"):
                      # Lọc theo vùng dựa vào ký tự trong tên file ROM HyperOS
                      if target_region == "China" and "CN" in filename:
                          package_name = filename
                          version_code = item.get("version", "")
                          break
                      elif target_region == "EEA" and ("EU" in filename or "EEA" in filename.upper()):
                          package_name = filename
                          version_code = item.get("version", "")
                          break
                          
          if not package_name or not version_code:
              print(f"[THẤT BẠI] Hiện chưa có dữ liệu ROM thật của {device_code} được index trên hệ thống Tracker.")
              sys.exit(1)

          # Sinh link tải tốc độ cao Aliyun từ dữ liệu thật
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"\n[THÀNH CÔNG RỰC RỠ]")
          print(f"-> Version thật: {version_code}")
          print(f"-> File name thật: {package_name}")
          print(f"-> Link Aliyun: {final_download_url}\n")
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
