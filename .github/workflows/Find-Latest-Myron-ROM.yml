name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy dữ liệu thật từ API Xiaomi Firmware Updater
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os
          import sys

          target_region = "${{ matrix.region }}"
          
          # Bản China: myron, Bản EEA: myron_global (theo chuẩn đặt tên của MIUI Updates Tracker)
          device_code = "myron" if target_region == "China" else "myron_global"
          
          # Gọi file JSON nguyên gốc từ Github (Không bao giờ bị chặn)
          api_url = "https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery/stable_recovery.json"
          
          print(f"--- Đang truy xuất dữ liệu thật cho thiết bị: {device_code} ({target_region}) ---")
          
          try:
              res = requests.get(api_url, timeout=15)
              res.raise_for_status()
              data = res.json()
          except Exception as e:
              print(f"[LỖI TỆ TỘI] Không thể tải dữ liệu JSON từ Tracker: {e}")
              sys.exit(1)
              
          package_name = ""
          version_code = ""
          
          # Duyệt tìm bản ROM Recovery mới nhất cho Myron
          for item in data:
              # Tracker này sử dụng "codename" để phân biệt
              if item.get("codename") == device_code:
                  download_link = item.get("url", "")
                  if download_link.endswith(".zip"):
                      package_name = download_link.split("/")[-1]
                      version_code = item.get("version", "")
                      break
                      
          if not package_name or not version_code:
              print(f"[THẤT BẠI] Không tìm thấy dữ liệu ROM thật nào cho {device_code} trên Tracker.")
              sys.exit(1)

          # Sinh link tải tốc độ cao Aliyun từ dữ liệu thật vừa cào được
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"[THÀNH CÔNG RỰC RỠ]")
          print(f"-> Version thật: {version_code}")
          print(f"-> File name thật: {package_name}")
          print(f"-> Link Aliyun: {final_download_url}")
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
