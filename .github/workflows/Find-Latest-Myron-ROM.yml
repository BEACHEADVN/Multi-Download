name: Scrape MiuiRom Org List

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scrape Page Data
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          echo "==> System: Connecting to $TARGET_URL..."
          
          # 1. Tải mã nguồn HTML về file tạm
          curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$TARGET_URL" > source.html
          
          if [ ! -s source.html ]; then
              echo "❌ Error: Không tải được dữ liệu từ miuirom.org"
              exit 1
          fi

          echo "=================================================="
          echo " LATEST FIRMWARE UPDATES (MIUIROM.ORG)"
          echo "=================================================="

          # 2. Định nghĩa danh sách phân vùng cần bóc tách dựa theo giao diện ảnh chụp
          REGIONS=("Global" "Europe" "China" "Indonesia" "Taiwan")

          for REGION in "${REGIONS[@]}"; do
              # Tìm dòng chứa tên phân vùng và lấy thêm 5 dòng tiếp theo (chứa mã OS)
              REGION_BLOCK=$(grep -i -A 5 ">$REGION<" source.html || grep -i -A 5 "$REGION" source.html)
              
              if [ -n "$REGION_BLOCK" ]; then
                  # Dùng regex lọc ra chuỗi phiên bản dạng OS3.0.X.X.WPMXXXX
                  VERSION=$(echo "$REGION_BLOCK" | grep -oE 'OS[0-9.]+\.[0-9A-Z]+' | head -n 1)
                  
                  if [ -n "$VERSION" ]; then
                      printf "📍 %-12s : %s\n" "$REGION" "$VERSION"
                  else
                      printf "📍 %-12s : Tìm thấy phân vùng nhưng chưa bóc tách được mã version\n" "$REGION"
                  fi
              else
                  printf "📍 %-12s : Không tìm thấy block dữ liệu trên trang\n" "$REGION"
              fi
          done
          echo "=================================================="
