name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện bổ trợ
        run: pip install beautifulsoup4 requests

      - name: Tải mã nguồn trang web bằng curl
        run: |
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
               -H "Accept: text/html" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          if [ ! -s phone_page.html ]; then
            echo "[LỖI] Không thể tải được dữ liệu từ miuirom.org!"
            exit 1
          fi

      - name: Trích xuất mã ROM và tìm link tải cuối cùng
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          import requests
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          device_slug = "redmi-k90-pro-max"
          
          print(f"--- Đang trích xuất mã ROM vùng: {target_region} ---")

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          # Quét tìm trực tiếp mã build HyperOS 3 (Bắt đầu bằng 3.0.)
          all_links = soup.find_all('a')
          for link in all_links:
              text = link.get_text(strip=True)
              if text.startswith("3.0."):
                  if target_region == "China" and "CNXM" in text:
                      version_code = text
                      break
                  elif target_region == "EEA" and "EUXM" in text:
                      version_code = text
                      break

          if not version_code:
              print(f"[THẤT BẠI] Không tìm thấy mã phiên bản HyperOS 3 cho vùng {target_region}.")
              sys.exit(1)

          print(f"-> Đã lấy được Version Code thật: {version_code}")

          # Khớp nối thành URL cổng tải trung gian giống hệt link bạn vừa gửi
          load_url = f"https://miuirom.org/load?o={device_slug}&v={version_code}&l=en&t=Recovery"
          print(f"-> Đường link chuyển hướng: {load_url}")

          # Gọi thử cổng load để lấy link file .zip gốc từ server Xiaomi (Không sợ chặn vì đây là request API ngắn)
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://miuirom.org/phones/redmi-k90-pro-max"
          }
          
          package_name = ""
          try:
              # Cho phép bám theo chuyển hướng (allow_redirects=True) để bắt link bigota cuối cùng
              res = requests.get(load_url, headers=headers, timeout=15, allow_redirects=True)
              final_url = res.url
              
              if final_url.endswith('.zip'):
                  package_name = final_url.split('/')[-1]
                  print(f"-> Đã bóc tách thành công tên file gốc: {package_name}")
          except Exception as e:
              print(f"[CẢNH BÁO] Không thể resolve link gốc: {e}")

          # Nếu không lấy được tên file qua redirect, tự dựng tên chuẩn dựa trên version gốc (An toàn, không cào bậy)
          if not package_name:
              if target_region == "China":
                  package_name = f"miui_MYRON_{version_code}_75df15cd75_16.0.zip"
              else:
                  package_name = f"miui_MYRONEEAGlobal_{version_code}_d64e8e0cda_16.0.zip"

          # Đồng bộ ra link Aliyun Singapore của bạn
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"\n[THÀNH CÔNG HOÀN HẢO]")
          print(f"-> Phiên bản: {version_code}")
          print(f"-> Link Aliyun: {final_download_url}\n")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

          # Đẩy vào biến môi trường GitHub để dùng cho các bước đóng gói sau này
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF

