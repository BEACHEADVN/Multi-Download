name: Get Redmi K90 Pro Max ROM Link

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng muốn lấy link tải (china, eea, global, taiwan, indonesia)'
        required: true
        default: 'china'

jobs:
  get-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Construct and Fetch Direct Link
        env:
          CHOSEN_REGION: ${{ github.event.inputs.region || 'china' }}
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          REGION_UPPER=$(echo "${{ env.CHOSEN_REGION }}" | tr '[:lower:]' '[:upper:]')
          
          echo "==> Bước 1: Tải giao diện trang chủ..."
          curl -s -L -H "User-Agent: $USER_AGENT" "$TARGET_URL" > main.html

          # Xác định mã định danh phân vùng
          if [ "${{ env.CHOSEN_REGION }}" = "china" ]; then
              REG_KEY="WPMCNXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "eea" ] || [ "${{ env.CHOSEN_REGION }}" = "europe" ]; then
              REG_KEY="WPMEUXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "taiwan" ]; then
              REG_KEY="WPMTWXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "indonesia" ]; then
              REG_KEY="WPMIDXM"
          else
              REG_KEY="WPMMIXM"
          fi

          echo "==> Bước 2: Bóc tách chính xác số phiên bản cho vùng $REGION_UPPER..."
          # Lấy chính xác chuỗi phiên bản đầy đủ từ trang chủ (Ví dụ: 3.0.306.0.WPMCNXM)
          FULL_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[A-Z]+' main.html | grep "$REG_KEY" | head -n 1)

          if [ -z "$FULL_VERSION" ]; then
              echo "❌ Thất bại: Không tìm thấy số phiên bản khớp với mã $REG_KEY trên trang chủ."
              exit 1
          fi

          echo "✅ Đã tìm thấy số phiên bản chuẩn: $FULL_VERSION"

          echo "==> Bước 3: Tự dựng URL chuyển tiếp (Bypass mã hóa Base64 của website)..."
          # Tự lắp ráp tham số thay vì đi cào chuỗi mã hóa bị lỗi
          CONSTRUCTED_URL="https://miuirom.org/load?o=redmi-k90-pro-max&v=${FULL_VERSION}&l=en&t=Recovery"
          echo "🔗 URL trang tải dựng sẵn: $CONSTRUCTED_URL"

          echo "==> Bước 4: Truy cập trang tải và trích xuất link CDN của Xiaomi..."
          # Tải trang con và dùng cấu trúc User-Agent chuẩn
          DOWNLOAD_PAGE=$(curl -s -L -H "User-Agent: $USER_AGENT" "$CONSTRUCTED_URL")

          # Tìm các link .zip chứa server bigota hoặc hugeota quen thuộc của Xiaomi
          DIRECT_LINK=$(echo "$DOWNLOAD_PAGE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.zip' | sort -u | head -n 1)

          # Nếu trang con vẫn không chứa link dạng văn bản thô, dùng giải pháp API Xiaomi gốc làm backup
          if [ -z "$DIRECT_LINK" ]; then
              echo "⚠️ Không tìm thấy link trực tiếp trên trang web. Thử ép tải qua cụm API chính thức..."
              
              API_URL="https://update.miui.com/updates/v1/fullrom.php"
              # Cấu hình payload chuẩn hóa loại bỏ chữ OS thừa
              PAYLOAD="d=myron&v=${FULL_VERSION}&b=F&r=${REG_KEY:3:2}&l=en_US&n=NONE"
              
              RESPONSE=$(curl -s -X POST "$API_URL" -H "Content-Type: application/x-www-form-urlencoded" -d "$PAYLOAD")
              DIRECT_LINK=$(echo "$RESPONSE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.zip' | head -n 1)
          fi

          echo "=================================================="
          echo " DOWNLOAD LINK FOR $REGION_UPPER"
          echo "=================================================="
          if [ -z "$DIRECT_LINK" ]; then
              echo "❌ Hệ thống không thể lấy được link tải tự động."
              echo "Giải pháp thủ công: Bạn có thể copy link trang tải dựng sẵn ở Bước 3 dán vào trình duyệt để bấm nút Download trực tiếp bằng tay."
          else
              echo "Phiên bản: $FULL_VERSION"
              echo "Đường link tải trực tiếp (Mở là tự động download):"
              echo "$DIRECT_LINK"
          fi
          echo "=================================================="
