name: Scrape Redmi K90 Pro Max ROM

on:
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng ROM cần lọc (eea, global, china, all)'
        required: true
        default: 'all'

  # Cấu hình chạy tự động định kỳ (Mặc định: 6 tiếng check 1 lần)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scrape MiuiRom Org Page
        env:
          REGION: ${{ github.event.inputs.region || 'all' }}
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          echo "==> System: Connecting to $TARGET_URL..."
          
          # 1. Tải mã nguồn HTML của trang web với User-Agent giả lập trình duyệt
          PAGE_SOURCE=$(curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$TARGET_URL")
          
          if [ -z "$PAGE_SOURCE" ] || echo "$PAGE_SOURCE" | grep -q "404 Not Found"; then
              echo "❌ Error: Không thể tải được trang web hoặc đường dẫn link đã thay đổi."
              exit 1
          fi

          # 2. Trích xuất tất cả các đường link tải về trực tiếp (.zip cho Recovery và .tgz cho Fastboot)
          # Server Xiaomi thường lưu ở cụm aliyuncs.com, bigota.d.miui.com hoặc hugeota.d.miui.com
          ALL_LINKS=$(echo "$PAGE_SOURCE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.(zip|tgz)' | sort -u)

          echo "=================================================="
          echo " CÀO DỮ LIỆU MIUROM.ORG THÀNH CÔNG"
          echo "=================================================="

          if [ -z "$ALL_LINKS" ]; then
              echo " [Thông báo] Trang web hiện tại chưa cập nhật bất kỳ link download trực tiếp nào."
              exit 0
          fi

          # 3. Phân loại và lọc link theo yêu cầu của người dùng
          if [ "${{ env.REGION }}" = "all" ]; then
              echo " TẤT CẢ CÁC BẢN ROM TÌM THẤY TRÊN TRANG:"
              echo "--------------------------------------------------"
              echo "$ALL_LINKS"
          else
              # Thiết lập từ khóa nhận diện Phân vùng trong tên File ROM của Xiaomi
              if [ "${{ env.REGION }}" = "eea" ]; then
                  FILTER_KEY="EU"
              elif [ "${{ env.REGION }}" = "china" ] || [ "${{ env.REGION }}" = "cn" ]; then
                  FILTER_KEY="CN"
              elif [ "${{ env.REGION }}" = "global" ] || [ "${{ env.REGION }}" = "gl" ]; then
                  FILTER_KEY="MI"
              else
                  FILTER_KEY="${{ env.REGION }}"
              fi

              echo " LỌC FILE ROM THEO PHÂN VÙNG: ${{ env.REGION^^ }}"
              echo "--------------------------------------------------"
              
              FILTERED_LINKS=$(echo "$ALL_LINKS" | grep -i "$FILTER_KEY")

              if [ -z "$FILTERED_LINKS" ]; then
                  echo "❌ Không tìm thấy link nào khớp với phân vùng '$FILTER_KEY'."
              else
                  echo "$FILTERED_LINKS"
              fi
          fi
          echo "=================================================="
