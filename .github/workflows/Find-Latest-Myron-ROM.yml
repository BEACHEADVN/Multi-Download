name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện BeautifulSoup
        run: pip install beautifulsoup4 requests

      - name: Tải mã nguồn trang web bằng curl
        run: |
          # Bắt buộc phải chạy lệnh này để sinh ra file phone_page.html
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
               -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               -H "Accept-Language: en-US,en;q=0.5" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          # Kiểm tra nếu file không tồn tại hoặc trống
          if [ ! -s phone_page.html ]; then
            echo "[LỖI] Không thể tải được file phone_page.html từ miuirom.org!"
            exit 1
          fi

      - name: Trích xuất tên phiên bản ROM thật từ giao diện chính xác
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          region_keyword = "China" if target_region == "China" else "Europe"
          
          print(f"--- Đang trích xuất tên phiên bản ROM thật cho vùng: {target_region} ({region_keyword}) ---")

          if not os.path.exists("phone_page.html"):
              print("[LỖI] Python không tìm thấy file phone_page.html!")
              sys.exit(1)

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          all_links = soup.find_all('a')
          
          # Quét tìm trực tiếp mã build HyperOS 3 dựa theo ảnh chụp màn hình của bạn
          for link in all_links:
              text = link.get_text(strip=True)
              if text.startswith("3.0."):
                  if target_region == "China" and "CNXM" in text:
                      version_code = text
                      break
                  elif target_region == "EEA" and "EUXM" in text:
                      version_code = text
                      break

          if not version_code:
              print(f"[THẤT BẠI] Không tìm thấy chuỗi phiên bản dạng 3.0.x.x cho vùng {target_region} trên giao diện web.")
              sys.exit(1)

          print(f"\n[KẾT QUẢ TRÍCH XUẤT THÀNH CÔNG]")
          print(f"-> Vùng: {target_region}")
          print(f"-> Mã phiên bản ROM thật: {version_code}\n")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
          # Lưu lại biến môi trường
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
