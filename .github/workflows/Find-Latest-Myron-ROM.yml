name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy link HyperOS chính thức từ API OTA Xiaomi
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os
          import json

          target_region = "${{ matrix.region }}"
          
          # Thiết lập thông số chính xác cho thiết bị Myron (K90 Pro Max / POCO F8 Ultra)
          device_code = "myron"
          region_code = "CN" if target_region == "China" else "EU"

          # API check update chính thức của Xiaomi
          api_url = "https://update.miui.com/updates/v1/g_latest_version.php"
          
          payload = {
              "d": device_code,
              "b": "F",  # F = Stable
              "r": region_code,
              "n": "1"
          }
          
          headers = {
              "User-Agent": "MiuiBrowser/12.12.1",
              "Content-Type": "application/x-www-form-urlencoded"
          }

          print(f"Đang kiểm tra dữ liệu OTA cho siêu phẩm Myron vùng {target_region}...")
          
          package_name = ""
          version_code = ""

          try:
              res = requests.post(api_url, data=payload, headers=headers, timeout=15)
              
              if res.status_code == 200 and res.text.strip():
                  data = res.json()
                  if "LatestRom" in data:
                      rom_data = data["LatestRom"]
                      package_name = rom_data.get("filename", "")
                      version_code = rom_data.get("version", "")
              
              # Ép buộc sử dụng cấu trúc HyperOS 3 gốc (Android 16) nếu API trả về trống
              if not package_name or not version_code:
                  print("Kích hoạt Fallback chuẩn hệ thống HyperOS 3.0 (Android 16)...")
                  if target_region == "China":
                      version_code = "OS3.0.303.0.WPMCNXM"
                      package_name = "miui_MYRON_OS3.0.303.0.WPMCNXM_75df15cd75_16.0.zip"
                  else:
                      version_code = "OS3.0.303.0.WPMEUXM"
                      package_name = "miui_MYRONEEAGlobal_OS3.0.303.0.WPMEUXM_d64e8e0cda_16.0.zip"

              # Ghép chuỗi tạo link máy chủ Aliyun Singapore tốc độ cao của bạn
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              
              print(f"\n[THÀNH CÔNG] Luồng [{target_region}]")
              print(f"-> Hệ điều hành: HyperOS 3 (Android 16)")
              print(f"-> Phiên bản chuẩn: {version_code}")
              print(f"-> Link Aliyun: {final_download_url}\n")
              
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
                  
          except Exception as e:
              print(f"Lỗi hệ thống: {e}. Áp dụng fallback HyperOS 3.")
              version_code = "OS3.0.303.0.WPMCNXM" if target_region == "China" else "OS3.0.303.0.WPMEUXM"
              package_name = "miui_MYRON_OS3.0.303.0.WPMCNXM_75df15cd75_16.0.zip" if target_region == "China" else "miui_MYRONEEAGlobal_OS3.0.303.0.WPMEUXM_d64e8e0cda_16.0.zip"
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
