name: Get Redmi K90 Pro Max ROM Link

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng muốn lấy link tải (china, eea, global, taiwan, indonesia)'
        required: true
        default: 'china'

jobs:
  get-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Direct Download Link
        env:
          CHOSEN_REGION: ${{ github.event.inputs.region || 'china' }}
        run: |
          TARGET_URL="https://miuirom.org/phones/redmi-k90-pro-max"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          REGION_UPPER=$(echo "${{ env.CHOSEN_REGION }}" | tr '[:lower:]' '[:upper:]')
          
          echo "==> Bước 1: Tải giao diện trang chủ..."
          curl -s -L -H "User-Agent: $USER_AGENT" "$TARGET_URL" > main.html

          # 1. Xác định mã phân vùng dựa trên lựa chọn của người dùng
          if [ "${{ env.CHOSEN_REGION }}" = "china" ]; then
              REG_KEY="WPMCNXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "eea" ] || [ "${{ env.CHOSEN_REGION }}" = "europe" ]; then
              REG_KEY="WPMEUXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "taiwan" ]; then
              REG_KEY="WPMTWXM"
          elif [ "${{ env.CHOSEN_REGION }}" = "indonesia" ]; then
              REG_KEY="WPMIDXM"
          else
              REG_KEY="WPMMIXM"
          fi

          echo "==> Bước 2: Bóc tách mã phiên bản đầy đủ cho phân vùng $REGION_UPPER..."
          
          # Lọc ra chuỗi phiên bản chính xác (Ví dụ: 3.0.306.0.WPMCNXM) có chứa mã vùng tương ứng
          FULL_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[A-Z]+' main.html | grep "$REG_KEY" | head -n 1)

          if [ -z "$FULL_VERSION" ]; then
              echo "❌ Thất bại: Không tìm thấy mã phiên bản nào khớp với ký tự $REG_KEY trên trang."
              exit 1
          fi

          echo "✅ Đã tìm thấy phiên bản: HyperOS $FULL_VERSION"

          echo "==> Bước 3: Tự động ráp nối cấu trúc link CDN vĩnh viễn của Xiaomi..."
          
          # Cấu trúc đặt tên file ROM chuẩn Recovery của Xiaomi từ trước đến nay:
          # miui_[codename]_[vùng_global/eea...]_full-[phiên_bản]-user-[phiên_bản_android]-[mã_md5_hoặc_id].zip
          # Tuy nhiên, đối với dòng máy mới chạy Android 16, định dạng file chuẩn sẽ là:
          # [codename]_[vùng_global/eea...]-ota_full-[phiên_bản]-user-[phiên_bản_android]-[chuỗi_bảo_mật].zip
          
          # Do miuirom.org không hiển thị chuỗi mã bảo mật đuôi (ví dụ: aa3aa56260), 
          # chúng ta sẽ tận dụng việc quét tìm xem trong toàn bộ source HTML có chứa file đuôi .zip nào có sẵn mã vùng không.
          
          DIRECT_LINK=$(grep -oE 'https://[^"]+\.zip' main.html | grep "$REG_KEY" | head -n 1)

          # Nếu trang chủ hoàn toàn giấu link .zip, ta dùng giải pháp dự phòng: Gọi thẳng API tìm kiếm của Xiaomi dựa trên mã chuẩn vừa bốc được
          if [ -z "$DIRECT_LINK" ]; then
              echo "⚠️ Link zip trực tiếp bị ẩn. Tiến hành gọi API phản hồi nhanh của Xiaomi..."
              
              API_URL="https://update.miui.com/updates/v1/fullrom.php"
              PAYLOAD="d=myron&v=OS${FULL_VERSION}&b=F&r=${REGION_UPPER:0:2}&l=en_US&n=NONE"
              
              # Gửi request kèm mã build CHÍNH XÁC vừa cào được để ép server Xiaomi nhả link không bị 404
              RESPONSE=$(curl -s -X POST "$API_URL" -H "Content-Type: application/x-www-form-urlencoded" -d "$PAYLOAD")
              DIRECT_LINK=$(echo "$RESPONSE" | grep -oE 'https://[a-zA-Z0-9./_-]+\.zip' | head -n 1)
          fi

          echo "=================================================="
          echo " DOWNLOAD LINK FOR $REGION_UPPER"
          echo "=================================================="
          if [ -z "$DIRECT_LINK" ]; then
              echo "❌ Không thể tạo được link tải tự động."
              echo "Có thể phiên bản $FULL_VERSION mới được cập nhật tên mã trên web chứ Xiaomi chưa phát hành file Rom chính thức."
          else
              echo "Phiên bản: $FULL_VERSION"
              echo "Link tải trực tiếp (Bấm vào là tải luôn):"
              echo "$DIRECT_LINK"
          fi
          echo "=================================================="
