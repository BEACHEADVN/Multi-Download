name: Tải ROM HyperOS China - Thiết bị Myron

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Chọn loại ROM để tải (recovery hoặc fastboot)'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - fastboot

jobs:
  download-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập biến môi trường và liên kết tải xuống
        run: |
          DEVICE="myron"
          TYPE="${{ github.event.inputs.rom_type }}"
          
          if [ "$TYPE" = "recovery" ]; then
            VERSION="OS3.0.306.0.WPMCNXM"
            # Link Recovery ROM ổn định mới nhất
            DOWNLOAD_URL="https://bigota.d.miui.com/OS3.0.306.0.WPMCNXM/miui_MYRON_OS3.0.306.0.WPMCNXM_8992a6c11a_16.0.zip"
          else
            VERSION="OS3.0.303.0.WPMCNXM"
            # Link Fastboot ROM ổn định mới nhất
            DOWNLOAD_URL="https://bigota.d.miui.com/OS3.0.303.0.WPMCNXM/myron_images_OS3.0.303.0.WPMCNXM_20260308.0000.00_16.0_cn_ca2cfb5ada.tgz"
          fi
          
          echo "ROM_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ROM_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "Đang chuẩn bị tải phiên bản $VERSION ($TYPE)..."

      - name: Tiến hành tải gói ROM trực tiếp từ máy chủ Xiaomi
        run: |
          echo "Đang tải xuống từ liên kết: ${{ env.ROM_URL }}"
          # Sử dụng mã băm bảo mật GitHub Secret đã lưu cấu hình trước đó
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Thực hiện lệnh tải file (Tự động lưu file dựa trên định dạng của link gốc)
          curl -L -O "${{ env.ROM_URL }}"
          
          echo "Quá trình tải xuống phiên bản ${{ env.ROM_VERSION }} thành công."

      - name: Xác thực tệp và xử lý gói cấu trúc
        run: |
          ls -lh
          # Thêm các câu lệnh giải nén hoặc xử lý boot.img/init_boot.img tùy theo nhu cầu KernelSU tại đây
