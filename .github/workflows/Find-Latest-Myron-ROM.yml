name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Tải mã nguồn trang web bằng curl
        run: |
          # Tải file HTML và lưu lại
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Accept: text/html" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          # Kiểm tra nếu file trống (lỗi kết nối hoặc 404)
          if [ ! -s phone_page.html ]; then
            echo "[LỖI] File tải về trống rỗng. Có thể trang web trả về 404 hoặc bị chặn!"
            exit 1
          fi

      - name: Kiểm tra sự tồn tại của từ khóa trong mã nguồn
        run: |
          echo "=== 1. KIỂM TRA TỪ KHÓA 'CHINA' ==="
          if grep -qi "china" phone_page.html; then
            echo "-> TÌM THẤY chữ 'China'. Dưới đây là các dòng chứa từ khóa:"
            grep -in "china" phone_page.html | head -n 10
          else
            echo "-> KHÔNG TÌM THẤY chữ 'China' nào."
          fi
          
          echo -e "\n=========================================\n"
          
          echo "=== 2. KIỂM TRA TỪ KHÓA 'EUROPE' ==="
          if grep -qi "europe" phone_page.html; then
            echo "-> TÌM THẤY chữ 'Europe'. Dưới đây là các dòng chứa từ khóa:"
            grep -in "europe" phone_page.html | head -n 10
          else
            echo "-> KHÔNG TÌM THẤY chữ 'Europe' nào."
          fi

          echo -e "\n=========================================\n"
          
          echo "=== 3. KIỂM TRA TỪ KHÓA 'HYPEROS' ==="
          if grep -qi "hyperos" phone_page.html; then
            echo "-> TÌM THẤY chữ 'HyperOS'."
          else
            echo "-> KHÔNG TÌM THẤY chữ 'HyperOS'."
          fi
