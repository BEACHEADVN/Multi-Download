name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Tải mã nguồn trang web bằng curl
        run: |
          # Tải file HTML và lưu lại
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Accept: text/html" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          # Kiểm tra nếu file trống (lỗi kết nối hoặc 404)
          if [ ! -s phone_page.html ]; then
            echo "[LỖI] File tải về trống rỗng. Có thể trang web trả về 404 hoặc bị chặn!"
            exit 1
          fi

      - name: Trích xuất tên phiên bản ROM thật từ Web
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          
          # Định vị thẻ neo theo cấu trúc menu của miuirom.org
          region_anchor = "#China" if target_region == "China" else "#EEA"
          
          print(f"--- Đang trích xuất tên phiên bản ROM cho vùng: {target_region} ---")

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          version_code = ""

          # Tìm đến block danh sách vùng 'region_list' để lấy chữ dữ liệu gốc
          region_list = soup.find('div', class_='region_list')
          if region_list:
              anchors = region_list.find_all('a', href=region_anchor)
              if anchors:
                  full_version_text = anchors[0].get_text(strip=True)
                  # Bỏ chữ 'HyperOS ' đi để lấy phần tên bản ROM nguyên bản
                  if "HyperOS " in full_version_text:
                      version_code = full_version_text.replace("HyperOS ", "").strip()

          if not version_code:
              print(f"[THẤT BẠI] Không thể tìm thấy tên phiên bản ROM nào hiển thị cho vùng {target_region}.")
              sys.exit(1)

          print(f"\n[KẾT QUẢ TRÍCH XUẤT THẬT]")
          print(f"-> Vùng: {target_region}")
          print(f"-> Tên phiên bản ROM: {version_code}\n")

          # Lưu biến môi trường để các bước sau sử dụng nếu cần
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
