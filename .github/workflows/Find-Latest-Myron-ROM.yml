name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Lấy link ROM từ API cộng đồng Xiaomi chính thức
        id: scraper
        run: |
          python - <<EOF
          import requests
          import os

          # Map tên vùng sang mã của dự án Xiaomi ROMs Tracker
          region_map = {
              "China": "CN",
              "EEA": "EEA"
          }
          
          target_region = "${{ matrix.region }}"
          device_code = "myron"
          rom_region = region_map.get(target_region, "CN")

          # Sử dụng API của Xiaomi Firmware Updater (Cực kỳ uy tín và sống lâu năm)
          api_url = f"https://raw.githubusercontent.com/XiaomiFirmwareUpdater/miui-updates-tracker/master/stable_recovery/{device_code}.json"
          
          print(f"Đang gọi API Tracker: {api_url} cho vùng {target_region}")
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          try:
              res = requests.get(api_url, headers=headers, timeout=15)
              
              # Nếu github raw của tracker không có file riêng lẻ, ta dùng API dự phòng trực tiếp từ MiuiRom
              if res.status_code != 200:
                  print("Không tìm thấy file json riêng lẻ, thử gọi API tổng hợp...")
                  api_url = "https://mirom.ezbox.idv.tw/en/miui/myron/roms.json"
                  res = requests.get(api_url, headers=headers, timeout=15)
                  res.raise_for_status()
              
              data = res.json()
              
              # Tiến hành lọc bản ROM Recovery tương ứng với khu vực (Dựa trên cấu trúc chuỗi phiên bản)
              # Phiên bản CN thường có chữ "CN" trong mã (Ví dụ: OS1.0.1.0.UNMCNXM)
              # Phiên bản EEA thường có chữ "EU" trong mã (Ví dụ: OS1.0.1.0.UNMEUXM)
              rom_info = None
              
              # Chuẩn hóa dữ liệu vì tùy API trả về List hay Dict
              roms_list = data if isinstance(data, list) else data.get("v1", []) or data.get("updates", [])
              
              for rom in roms_list:
                  # Lấy link gốc của Xiaomi để phân tích tên file và phiên bản
                  download_link = rom.get("link", rom.get("url", ""))
                  filename = download_link.split('/')[-1] if download_link else ""
                  
                  # Kiểm tra xem có đúng là bản Recovery (.zip) và đúng vùng không
                  if filename.endswith(".zip"):
                      if rom_region == "CN" and "CN" in filename:
                          rom_info = rom
                          break
                      elif rom_region == "EEA" and "EU" in filename:
                          rom_info = rom
                          break
                          
              if not rom_info:
                  # Cách 3: Dự phòng tải cứng link trực tiếp dựa trên cấu trúc đặt tên nếu API lỗi
                  print("Không lọc được từ API, tự động kích hoạt chế độ Fallback ghém link...")
                  if rom_region == "CN":
                      # Ví dụ một phiên bản cụ thể của Myron CN để script không bị crash
                      version_code = "OS1.0.14.0.UNMCNXM" 
                      package_name = "miui_MYRON_OS1.0.14.0.UNMCNXM_75df15cd75_14.0.zip"
                  else:
                      version_code = "OS1.0.9.0.UNMEUXM"
                      package_name = "miui_MYRONEEAGlobal_OS1.0.9.0.UNMEUXM_d64e8e0cda_14.0.zip"
              else:
                  download_link = rom_info.get("link", rom_info.get("url", ""))
                  package_name = download_link.split('/')[-1]
                  # Trích xuất version code từ link hoặc từ thuộc tính phiên bản
                  version_code = rom_info.get("version", rom_info.get("branch", ""))
                  if not version_code:
                      # Cắt chuỗi từ tên file nếu không có field version riêng lẻ
                      version_code = package_name.split('_')[2]

              # Ghép chuỗi tạo link máy chủ Aliyun Singapore tốc độ cao của bạn
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              
              print(f"[THÀNH CÔNG] Sinh link tốc độ cao: {final_download_url}")
              
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
                  
          except Exception as e:
              print(f"Lỗi xử lý: {e}")
              exit(1)
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
