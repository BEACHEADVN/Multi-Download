name: Find Latest Myron ROM

on:
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      region:
        description: 'Chọn phân vùng ROM (CN, GL, EEA)'
        required: true
        default: 'EEA'

  # Cấu hình chạy tự động định kỳ (Mặc định: 6 tiếng check 1 lần)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest ROM Link via cURL
        env:
          REGION: ${{ github.event.inputs.region || 'EEA' }}
        run: |
          DEVICE="myron"
          
          # Thiết lập phiên bản Base chuẩn xác
          if [ "${{ env.REGION }}" = "EEA" ]; then
              VERSION="OS3.0.301.0.WPMEUXM"
          elif [ "${{ env.REGION }}" = "CN" ]; then
              VERSION="OS3.0.301.0.WPMCNXM"
          else
              VERSION="OS3.0.301.0.WPMMIXM"
          fi

          echo "==> System: Requesting update for $DEVICE (${{ env.REGION }}) using base $VERSION..."
          
          # Thực hiện gửi request giả lập bằng cURL với đầy đủ các Header chuẩn của Xiaomi Updater
          RESPONSE=$(curl -s -X POST "https://update.miui.com/updates/v2/getrominfo.php" \
            -H "User-Agent: MiuiUpdater-App" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "d=$DEVICE" \
            --data-urlencode "v=$VERSION" \
            --data-urlencode "b=F" \
            --data-urlencode "r=${{ env.REGION }}" \
            --data-urlencode "l=en_US" \
            --data-urlencode "n=NONE")

          # Kiểm tra nếu phản hồi trống hoặc bị lỗi hệ thống
          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | grep -q "No input file specified" || echo "$RESPONSE" | grep -q "404"; then
              echo "❌ Error: Server Xiaomi vẫn từ chối phương thức kết nối hoặc chặn IP của GitHub."
              echo "Phản hồi từ Server: $RESPONSE"
              exit 1
          fi

          # Phân tích cú pháp JSON trả về
          echo "=================================================="
          echo " SERVER RESPONDED SUCCESSFULLY"
          echo "=================================================="
          
          # Kiểm tra xem có chứa trường thông tin bản ROM mới không
          if echo "$RESPONSE" | jq -e '.CurrentRom' >/dev/null 2>&1; then
              VERSION_NEW=$(echo "$RESPONSE" | jq -r '.CurrentRom.Version')
              FILENAME=$(echo "$RESPONSE" | jq -r '.CurrentRom.Filename')
              MD5=$(echo "$RESPONSE" | jq -r '.CurrentRom.MD5')
              LINK=$(echo "$RESPONSE" | jq -r '.CurrentRom.Link')
              
              echo " FOUND LATEST ROM FOR ${DEVICE^^}"
              echo "--------------------------------------------------"
              echo "Version: $VERSION_NEW"
              echo "Filename: $FILENAME"
              echo "MD5: $MD5"
              echo "Download Link: $LINK"
          else
              echo " [Mới Nhất] Không tìm thấy bản cập nhật nào mới hơn."
              echo "Chi tiết phản hồi hệ thống:"
              echo "$RESPONSE" | jq .
          fi
          echo "=================================================="
