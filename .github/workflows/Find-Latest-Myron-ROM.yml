name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Cào dữ liệu
        run: pip install requests beautifulsoup4

      - name: Tải mã nguồn trang web bằng curl
        run: |
          # Tải file HTML và lưu lại
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Accept: text/html" \
               --max-time 30 \
               "https://miuirom.org/phones/redmi-k90-pro-max" > phone_page.html

          # Kiểm tra nếu file trống (lỗi kết nối hoặc 404)
          if [ ! -s phone_page.html ]; then
            echo "[LỖI] File tải về trống rỗng. Có thể trang web trả về 404 hoặc bị chặn!"
            exit 1
          fi

      - name: Phân tích vùng và trích xuất link ROM thật
        id: scraper
        run: |
          python - <<EOF
          import os
          import sys
          from bs4 import BeautifulSoup

          target_region = "${{ matrix.region }}"
          
          # Ánh xạ ID neo (Anchor ID) từ Matrix GitHub sang ID trên miuirom.org
          # China tương ứng href='#China', EEA tương ứng href='#EEA'
          region_anchor = "#China" if target_region == "China" else "#EEA"
          
          print(f"--- Đang tìm kiếm liên kết thuộc vùng [{target_region}] với neo [{region_anchor}] ---")

          with open("phone_page.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          soup = BeautifulSoup(html_content, 'html.parser')
          
          package_name = ""
          version_code = ""

          # Bước 1: Tìm phiên bản được ghi nhận ở phần menu đầu trang để lấy version_code thật
          region_list = soup.find('div', class_='region_list')
          if region_list:
              anchors = region_list.find_all('a', href=region_anchor)
              if anchors:
                  # Lấy text dạng "HyperOS 3.0.306.0.WPMCNXM" và tách lấy phần mã phía sau
                  full_version_text = anchors[0].get_text(strip=True)
                  if "HyperOS " in full_version_text:
                      version_code = full_version_text.replace("HyperOS ", "").strip()

          # Bước 2: Quét toàn bộ các link trên trang để tìm file .zip gốc từ server Xiaomi khớp với mã vùng
          links = soup.find_all('a', href=True)
          for link in links:
              href = link['href']
              filename = href.split('/')[-1]
              
              # Lọc đúng tệp tin Recovery (.zip) chính thức từ server Xiaomi
              if filename.endswith('.zip') and ('bigota.d.miui.com' in href or 'hugeota.d.miui.com' in href):
                  
                  # So khớp sâu ký tự vùng trong tên file để đảm bảo tính chính xác
                  if target_region == "China" and "CN" in filename:
                      package_name = filename
                      if not version_code: # Dự phòng nếu bước 1 không lấy được
                          version_code = filename.split('_')[2]
                      break
                  elif target_region == "EEA" and ("EU" in filename or "EEA" in filename.upper()):
                      package_name = filename
                      if not version_code:
                          version_code = filename.split('_')[2]
                      break

          if not package_name or not version_code:
              print(f"[THẤT BẠI] Không thể bóc tách dữ liệu thật cho vùng {target_region}.")
              sys.exit(1)

          # Khớp nối tạo link tải tốc độ cao trên máy chủ Aliyun của bạn
          final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
          
          print(f"\n[THÀNH CÔNG RỰC RỠ]")
          print(f"-> Phiên bản thật: {version_code}")
          print(f"-> Tên tệp tin thật: {package_name}")
          print(f"-> Đường dẫn Aliyun: {final_download_url}\n")
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DOWNLOAD_URL={final_download_url}\n")
              f.write(f"ROM_VERSION={version_code}\n")
          EOF
