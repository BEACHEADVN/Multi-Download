name: Tự động tải ROM HyperOS dạng Matrix Song Song

on:
  workflow_dispatch:

jobs:
  fetch-and-download:
    name: Tải ROM ${{ matrix.region }} (Recovery)
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận chạy song song cho 2 vùng China và EEA
    strategy:
      matrix:
        region: [China, EEA]
      fail-fast: false # Giúp luồng này không bị dừng nếu luồng kia gặp sự cố

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cào dữ liệu ROM Myron trực tiếp từ MiRom
        id: scraper
        run: |
          python - <<EOF
          import requests
          from bs4 import BeautifulSoup
          import os

          target_region = "${{ matrix.region }}"
          
          # Trang tổng hợp ROM thuần text, rất nhẹ và không chặn GitHub Actions
          url = "https://mirom.ezbox.idv.tw/en/miui/myron/"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print(f"Đang cào dữ liệu thiết bị Myron tại: {url}")
          
          package_name = ""
          version_code = ""

          try:
              res = requests.get(url, headers=headers, timeout=15)
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, 'html.parser')
                  
                  # Tìm tất cả các liên kết tải về trên trang
                  links = soup.find_all('a', href=True)
                  for link in links:
                      href = link['href']
                      # Lọc ra các file Recovery (.zip) chính thức từ server Xiaomi
                      if href.endswith('.zip') and ('bigota.d.miui.com' in href or 'hugeota.d.miui.com' in href):
                          filename = href.split('/')[-1]
                          
                          # Phân loại vùng dựa trên ký tự nhận diện của bản ROM
                          if target_region == "China" and "CNXM" in filename:
                              package_name = filename
                              # Trích xuất Version từ tên file (Ví dụ: miui_MYRON_OS2.0.1.0.UNMCNXM...)
                              version_code = filename.split('_')[2]
                              break
                          elif target_region == "EEA" and "EUXM" in filename:
                              package_name = filename
                              version_code = filename.split('_')[2]
                              break
                              
              if not package_name:
                  print("Không tìm thấy link trên web, tự động chuyển sang chế độ gán cứng phiên bản mặc định...")
                  if target_region == "China":
                      version_code = "OS2.0.1.0.UNMCNXM"
                      package_name = "miui_MYRON_OS2.0.1.0.UNMCNXM_75df15cd75_15.0.zip"
                  else:
                      version_code = "OS2.0.1.0.UNMEUXM"
                      package_name = "miui_MYRONEEAGlobal_OS2.0.1.0.UNMEUXM_d64e8e0cda_15.0.zip"

              # Ghép chuỗi tạo link máy chủ Aliyun Singapore tốc độ cao của bạn
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              
              print(f"\n[THÀNH CÔNG] Luồng [{target_region}]")
              print(f"-> Phiên bản nhận diện: {version_code}")
              print(f"-> Link Aliyun: {final_download_url}\n")
              
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
                  
          except Exception as e:
              print(f"Lỗi phát sinh: {e}. Áp dụng cấu hình mặc định.")
              version_code = "OS2.0.1.0.UNMCNXM" if target_region == "China" else "OS2.0.1.0.UNMEUXM"
              package_name = "miui_MYRON_OS2.0.1.0.UNMCNXM_75df15cd75_15.0.zip" if target_region == "China" else "miui_MYRONEEAGlobal_OS2.0.1.0.UNMEUXM_d64e8e0cda_15.0.zip"
              final_download_url = f"https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/{version_code}/{package_name}"
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"DOWNLOAD_URL={final_download_url}\n")
                  f.write(f"ROM_VERSION={version_code}\n")
          EOF

      - name: Thực hiện tải gói ROM chính thức
        run: |
          echo "Luồng ${{ matrix.region }} đang tải phiên bản: ${{ env.ROM_VERSION }}"
          echo "Đường dẫn tải tốc độ cao: ${{ env.DOWNLOAD_URL }}"
          
          # Tích hợp mã bảo mật cá nhân của bạn
          SECRET_HASH="${{ secrets.MY_KSU_HASH }}"
          
          # Tiến hành tải bằng curl độc lập trên máy ảo này
          curl -L -O "${{ env.DOWNLOAD_URL }}"
          
          echo "Hoàn thành quá trình tải tệp của luồng ${{ matrix.region }}!"
          ls -lh
