name: NeoZygisk

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest
        run: git pull origin main || true

      - name: Get Release Info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import os, requests

          repo = "JingMatrix/NeoZygisk"
          headers = {"Authorization": f"token {os.environ['GH_TOKEN']}"}

          try:
              response = requests.get(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers=headers
              )
              data = response.json()

              tag = data.get("tag_name", "")
              date = data.get("published_at", data.get("created_at", ""))

              assets = data.get("assets", [])

              # chỉ lấy bản release thường, bỏ debug
              zip_asset = next(
                  (
                      a for a in assets
                      if a["name"].endswith(".zip")
                      and "debug" not in a["name"].lower()
                  ),
                  None
              )

              if not zip_asset:
                  print("No normal release zip found")
                  exit(1)

              file_name = zip_asset["name"]
              dl_url = zip_asset["browser_download_url"]
              size = zip_asset["size"]

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(
                      f"tag={tag}\n"
                      f"file_name={file_name}\n"
                      f"dl_url={dl_url}\n"
                      f"size={size}\n"
                      f"date={date}\n"
                  )

          except Exception as e:
              print(f"Error: {e}")
              exit(1)

      - name: Check State
        id: check
        run: |
          touch neozygisk_state.txt
          if [ "${{ steps.info.outputs.tag }}" = "$(cat neozygisk_state.txt)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -L \
            -o "${{ steps.info.outputs.file_name }}" \
            "${{ steps.info.outputs.dl_url }}"

      - name: Send Notification
        if: steps.check.outputs.skip != 'true'
        uses: xireiki/channel-post@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_USER_ID }}
          context: |
            <a href="https://github.com/JingMatrix/NeoZygisk">
            https://github.com/JingMatrix/NeoZygisk
            </a>
          parse_mode: HTML
          method: sendMessage

      - name: Upload to Telegram
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.info.outputs.tag }}
          SIZE: ${{ steps.info.outputs.size }}
          DATE: ${{ steps.info.outputs.date }}
          FILE_NAME: ${{ steps.info.outputs.file_name }}
        shell: python
        run: |
          import os, requests, datetime

          def get_size(b):
              b = int(b)
              for unit in ["B", "KB", "MB"]:
                  if b < 1024:
                      return f"{b:.2f} {unit}"
                  b /= 1024
              return f"{b:.2f} GB"

          try:
              date_obj = datetime.datetime.strptime(
                  os.environ["DATE"],
                  "%Y-%m-%dT%H:%M:%SZ"
              ) + datetime.timedelta(hours=7)

              date_str = date_obj.strftime("%d/%m/%Y %H:%M")

          except:
              date_str = "N/A"

          caption = (
              f"<b>🚀 NeoZygisk Update!</b>\n\n"
              f"📦 Phiên bản: <code>{os.environ['TAG']}</code>\n"
              f"📊 Dung lượng: <code>{get_size(os.environ['SIZE'])}</code>\n"
              f"📅 Cập nhật: <code>{date_str}</code>"
          )

          with open(os.environ["FILE_NAME"], "rb") as f:
              requests.post(
                  f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendDocument",
                  data={
                      "chat_id": os.environ["CHAT_ID"],
                      "caption": caption,
                      "parse_mode": "HTML"
                  },
                  files={"document": (os.environ["FILE_NAME"], f)}
              )

      - name: Save State
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ steps.info.outputs.tag }}" > neozygisk_state.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add neozygisk_state.txt
          git commit -m "Update NeoZygisk to ${{ steps.info.outputs.tag }}" || exit 0

          git pull --rebase origin main
          git push
