name: HyperOS ROM Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: hyperos-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install telethon
          fi

      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          # Sửa tên file ở đây thành telegram_session.session cho đúng với code Python
          echo "$TELEGRAM_SESSION" | base64 -d > telegram_session.session

      - name: Create config.json
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cat > config.json <<EOF
          {
            "api_id": ${API_ID},
            "api_hash": "${API_HASH}",
            "channel": "TECH_MUKUL",
            "search_limit": 30,
            "output_dir": "output"
          }
          EOF

      - name: Run tracker
        env:
          # Truyền thêm các biến này vào phòng trường hợp file python cần dùng tới
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python .github/workflows/telegram/hyperos.py

       - name: Test Download Speed (Recovery Links)
        run: |
          # 1. Trích xuất link Official từ file myron.json vừa tạo
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          
          # 2. Trích xuất link Mirror từ file myron.json
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['mirror'])")
          
          echo "=================================================="
          echo "TESTING DOWNLOAD SPEED FROM GITHUB ACTIONS RUNNER"
          echo "=================================================="
          
          # Test link Official (Giới hạn tải 50MB để test tốc độ nhanh, tránh nghẽn workflow)
          if [ "$OFFICIAL_URL" != "None" ]; then
            echo "👉 Testing Official Recovery Server..."
            curl -L -G --max-filesize 52428800 -o /dev/null --speed-time 10 --speed-limit 1 "$OFFICIAL_URL" 2>&1 | tail -n 5
          else
            echo "❌ Official URL not found."
          fi
          
          echo "--------------------------------------------------"
          
          # Test link Mirror
          if [ "$MIRROR_URL" != "None" ]; then
            echo "👉 Testing Mirror Recovery Server..."
            curl -L -G --max-filesize 52428800 -o /dev/null --speed-time 10 --speed-limit 1 "$MIRROR_URL" 2>&1 | tail -n 5
          else
            echo "❌ Mirror URL not found."
          fi
          echo "=================================================="   

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update HyperOS"

          git push
