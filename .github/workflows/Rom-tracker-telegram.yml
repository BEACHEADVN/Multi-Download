Lấy 2 link của recovery rồi tải để xem tốc độ

Để kiểm tra tốc độ tải (Download Speed) của 2 link Recovery (gồm link Official từ server Aliyun và link Mirror từ server Miui) ngay trên môi trường hạ tầng của GitHub Actions, bạn có thể dùng lệnh curl kết hợp ghi đè xuất dữ liệu ra thiết bị trống (/dev/null) để không làm tốn dung lượng ổ đĩa của Runner.

Dưới đây là đoạn code cấu hình bổ sung vào file workflow .yaml của bạn để tự động lấy 2 link này và test tốc độ:

Thêm bước này vào sau bước Run tracker trong file YAML:
YAML
      - name: Test Download Speed (Recovery Links)
        run: |
          # 1. Trích xuất link Official từ file myron.json vừa tạo
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          
          # 2. Trích xuất link Mirror từ file myron.json
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['mirror'])")
          
          echo "=================================================="
          echo "TESTING DOWNLOAD SPEED FROM GITHUB ACTIONS RUNNER"
          echo "=================================================="
          
          # Test link Official (Giới hạn tải 50MB để test tốc độ nhanh, tránh nghẽn workflow)
          if [ "$OFFICIAL_URL" != "None" ]; then
            echo "👉 Testing Official Recovery Server..."
            curl -L -G --max-filesize 52428800 -o /dev/null --speed-time 10 --speed-limit 1 "$OFFICIAL_URL" 2>&1 | tail -n 5
          else
            echo "❌ Official URL not found."
          fi
          
          echo "--------------------------------------------------"
          
          # Test link Mirror
          if [ "$MIRROR_URL" != "None" ]; then
            echo "👉 Testing Mirror Recovery Server..."
            curl -L -G --max-filesize 52428800 -o /dev/null --speed-time 10 --speed-limit 1 "$MIRROR_URL" 2>&1 | tail -n 5
          else
            echo "❌ Mirror URL not found."
          fi
          echo "=================================================="
Cách đọc kết quả hiển thị trong Log:
Khi bước này chạy, bạn sẽ nhìn thấy bảng thống kê băng thông thời gian thực của curl xuất ra như thế này:

Plaintext
  % Total    % Received % Xferd  Average Speed   Time    Time     Time  Current
                                 Dload  Upload   Total   Spent    Left  Speed
 10 3935M   10  410M    0     0  75.2M      0  0:00:52  0:00:05  0:00:47 84.1M
Average Speed (Dload): Tốc độ tải trung bình từ trước đến giờ.

Current Speed: Tốc độ tải ngay tại giây hiện tại.

Số hiển thị dạng M tương đương với MB/s (MegaBytes mỗi giây). Ví dụ 84.1M nghĩa là tốc độ đạt ~84 Megabytes/s (tương đương mạng ~700 Mbps).

Không tét nữa tải 2 link recovery

Nếu bạn muốn tải xuống toàn bộ file của cả 2 link Recovery (thay vì chỉ test tốc độ) để phục vụ cho các bước xử lý sau (ví dụ: giải nén, lấy file boot.img, payload, v.v.), bạn có thể dùng wget hoặc curl.

Dưới đây là đoạn code để bạn đưa vào file workflow .yaml, thay thế cho bước test tốc độ trước đó:

Thêm bước này vào file YAML:
YAML
      - name: Download Recovery ROMs
        run: |
          # 1. Trích xuất link từ file myron.json
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['mirror'])")
          
          # Tạo thư mục chứa file tải về
          mkdir -p downloads
          
          echo "=================================================="
          echo "STARTING DOWNLOAD"
          echo "=================================================="
          
          # Tải link Official
          if [ "$OFFICIAL_URL" != "None" ] && [ ! -z "$OFFICIAL_URL" ]; then
            echo "📥 Downloading Official Recovery ROM..."
            # Tải và lưu vào thư mục downloads/
            wget -c -P downloads/ "$OFFICIAL_URL"
          else
            echo "❌ Official URL is empty."
          fi
          
          echo "--------------------------------------------------"
          
          # Tải link Mirror
          if [ "$MIRROR_URL" != "None" ] && [ ! -z "$MIRROR_URL" ]; then
            echo "📥 Downloading Mirror Recovery ROM..."
            wget -c -P downloads/ "$MIRROR_URL"
          else
            echo "❌ Mirror URL is empty."
          fi
          
          echo "=================================================="
          echo "Danh sách file đã tải thành công:"
          ls -lh downloads/
⚠️ Lưu ý quan trọng về dung lượng ổ đĩa: > Mỗi file Recovery ROM của Xiaomi thường nặng từ 4GB đến 7GB. Nếu bạn tải cả 2 file cùng lúc, tổng dung lượng sẽ lên tới gần 10GB - 14GB.

Môi trường chạy GitHub Actions miễn phí (Ubuntu Runner) có sẵn khoảng 14GB - 17GB trống. Việc tải cả 2 file có thể làm phân vùng đĩa bị đầy và gây ra lỗi No space left on device ở các bước sau. Nếu bạn chỉ cần lấy file để xử lý, khuyến khích bạn chỉ nên chọn tải 1 trong 2 link (ưu tiên link Official hoặc Mirror tùy tốc độ).

Wget tạo ra nhiều output tải làm không theo dõi step nổi luôn

Để wget không làm tràn ngập màn hình log (khiến bạn không theo dõi được các bước chạy khác), bạn có thể chuyển sang dùng tham số -q --show-progress.

Tham số này sẽ ẩn toàn bộ các dòng log rác (thông tin kết nối, header, v.v.) và chỉ giữ lại duy nhất một thanh tiến trình (progress bar) chạy gọn gàng trên một dòng.

Bạn hãy thay đổi bước tải file trong file .yaml như sau:

YAML
      - name: Download Recovery ROMs
        run: |
          # 1. Trích xuất link từ file myron.json
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['mirror'])")
          
          mkdir -p downloads
          
          echo "=================================================="
          
          # Tải link Official (gọn gàng, chỉ hiện thanh tiến trình)
          if [ "$OFFICIAL_URL" != "None" ] && [ ! -z "$OFFICIAL_URL" ]; then
            echo "📥 Downloading Official Recovery ROM..."
            wget -q --show-progress -c -P downloads/ "$OFFICIAL_URL"
          else
            echo "❌ Official URL is empty."
          fi
          
          echo "--------------------------------------------------"
          
          # Tải link Mirror (gọn gàng, chỉ hiện thanh tiến trình)
          if [ "$MIRROR_URL" != "None" ] && [ ! -z "$MIRROR_URL" ]; then
            echo "📥 Downloading Mirror Recovery ROM..."
            wget -q --show-progress -c -P downloads/ "$MIRROR_URL"
          else
            echo "❌ Mirror URL is empty."
          fi
          
          echo "=================================================="
          echo "Danh sách file đã tải thành công:"
          ls -lh downloads/
Giải thích tham số đã thêm:
-q (quiet): Tắt hoàn toàn chế độ xuất log mặc định của wget.

--show-progress: Ép wget chỉ hiển thị thanh phần trăm (%) và tốc độ tải, tự động cập nhật đè lên một dòng duy nhất trên console của GitHub Actions thay vì sinh ra hàng ngàn dòng mới.

Dùng aria2 nhanh hơn không

Có, aria2 (hay aria2c) nhanh hơn rất nhiều so với wget hay curl trong môi trường GitHub Actions.

Lý do chính là wget chỉ tải bằng 1 kết nối duy nhất (single-connection). Trong khi đó, aria2 hỗ trợ tải đa luồng (multi-connection), cắt nhỏ file ra để tải đồng thời từ một hoặc nhiều server, giúp tận dụng tối đa băng thông cực khủng của server GitHub Actions (thường lên tới 1Gbps - 2Gbps).

Hơn nữa, aria2 mặc định hiển thị log cực kỳ gọn, chỉ cập nhật trên một dòng duy nhất nên không làm rối màn hình step của bạn.

Cách áp dụng aria2 vào GitHub Actions
Bạn có thể thay thế bước tải bằng đoạn script sau. Script sẽ cài đặt aria2 và tiến hành tải đa luồng (16 luồng mỗi file):

YAML
      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download Recovery ROMs with aria2
        run: |
          # 1. Trích xuất link từ file myron.json
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['mirror'])")
          
          mkdir -p downloads
          
          echo "=================================================="
          echo "STARTING DOWNLOAD WITH ARIA2 (16 THREADS)"
          echo "=================================================="
          
          # Tải link Official
          if [ "$OFFICIAL_URL" != "None" ] && [ ! -z "$OFFICIAL_URL" ]; then
            echo "📥 Downloading Official Recovery ROM..."
            aria2c -x 16 -s 16 -d downloads/ "$OFFICIAL_URL"
          else
            echo "❌ Official URL is empty."
          fi
          
          echo "--------------------------------------------------"
          
          # Tải link Mirror
          if [ "$MIRROR_URL" != "None" ] && [ ! -z "$MIRROR_URL" ]; then
            echo "📥 Downloading Mirror Recovery ROM..."
            aria2c -x 16 -s 16 -d downloads/ "$MIRROR_URL"
          else
            echo "❌ Mirror URL is empty."
          fi
          
          echo "=================================================="
          echo "Danh sách file đã tải thành công:"
          ls -lh downloads/
Giải thích các tham số tối ưu tốc độ của aria2c:
-x 16: Cho phép thiết lập tối đa 16 kết nối (luồng) đến cùng một server.

-s 16: Chia file làm 16 phần để tải đồng thời.

-d downloads/: Chỉ định thư mục lưu file tải về là downloads/.

Bỏ download mirror đi

Dưới đây là file workflow .yaml sau khi đã loại bỏ hoàn toàn phần tải link Mirror, chỉ giữ lại duy nhất bước cài đặt aria2 và tải link Official với 16 luồng để đạt tốc độ tối đa:

YAML
      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download Official Recovery ROM with aria2
        run: |
          # 1. Trích xuất duy nhất link Official từ file myron.json
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          
          mkdir -p downloads
          
          echo "=================================================="
          echo "STARTING DOWNLOAD OFFICIAL ROM WITH ARIA2"
          echo "=================================================="
          
          # Tiến hành tải nếu link tồn tại
          if [ "$OFFICIAL_URL" != "None" ] && [ ! -z "$OFFICIAL_URL" ]; then
            echo "📥 Downloading Official Recovery ROM (16 Threads)..."
            aria2c -x 16 -s 16 -d downloads/ "$OFFICIAL_URL"
          else
            echo "❌ Official URL is empty or not found."
            exit 1
          fi
          
          echo "=================================================="
          echo "Danh sách file đã tải thành công:"
          ls -lh downloads/
          
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update HyperOS"

          git push
