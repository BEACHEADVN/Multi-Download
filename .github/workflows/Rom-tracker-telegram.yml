name: HyperOS ROM Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: hyperos-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install telethon
          fi

      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          # Sửa tên file ở đây thành telegram_session.session cho đúng với code Python
          echo "$TELEGRAM_SESSION" | base64 -d > telegram_session.session

      - name: Create config.json
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cat > config.json <<EOF
          {
            "api_id": ${API_ID},
            "api_hash": "${API_HASH}",
            "channel": "TECH_MUKUL",
            "search_limit": 30,
            "output_dir": "output"
          }
          EOF

      - name: Run tracker
        env:
          # Truyền thêm các biến này vào phòng trường hợp file python cần dùng tới
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python .github/workflows/telegram/hyperos.py

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download Official Recovery ROM with aria2
        run: |
          # 1. Trích xuất duy nhất link Official từ file myron.json
          OFFICIAL_URL=$(python3 -c "import json; print(json.load(open('myron.json'))['downloads']['recovery']['official'])")
          
          mkdir -p downloads
          
          echo "=================================================="
          echo "STARTING DOWNLOAD OFFICIAL ROM WITH ARIA2"
          echo "=================================================="
          
          # Tiến hành tải nếu link tồn tại
          if [ "$OFFICIAL_URL" != "None" ] && [ ! -z "$OFFICIAL_URL" ]; then
            echo "📥 Downloading Official Recovery ROM (16 Threads)..."
            aria2c -x 16 -s 16 -d downloads/ "$OFFICIAL_URL"
          else
            echo "❌ Official URL is empty or not found."
            exit 1
          fi
          
          echo "=================================================="
          echo "Danh sách file đã tải thành công:"
          ls -lh downloads/
          
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update HyperOS"

          git push
