name: HyperOS ROM Tracker
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperos-tracker
  cancel-in-progress: false

jobs:
  # JOB 1: Chỉ thuần túy kiểm tra và cứu hộ file workflows sang repo TARGET nếu bị thiếu
  prepare-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: 'BEACHEADVN/nothingsvn_xiaomi-stocktoolbuild'
          token: ${{ secrets.GH_TOKEN }}
          ref: 'main'

      - name: Verify and Download Workflow Files to Target Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          echo "=== KIỂM TRA CÁC WORKFLOWS TRÊN REPO TARGET ==="
          mkdir -p .github/workflows
          
          UPDATED=0

          # Kiểm tra file bat-link-tu-tracker.yml trên repo target
          if [ -f .github/workflows/bat-link-tu-tracker.yml ]; then
            echo "✅ Đã có sẵn trên target: bat-link-tu-tracker.yml"
          else
            echo "❌ Không tìm thấy bat-link-tu-tracker.yml trên target. Tiến hành tải..."
            curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3.raw" \
              -L "https://api.github.com/repos/BEACHEADVN/My-Assets/contents/ROM/repo/workflow-bat-link-tu-tracker.txt?ref=main" \
              -o .github/workflows/bat-link-tu-tracker.yml
            UPDATED=1
          fi

          # Kiểm tra file mod-repo.yml trên repo target
          if [ -f .github/workflows/mod-repo.yml ]; then
            echo "✅ Đã có sẵn trên target: mod-repo.yml"
          else
            echo "❌ Không tìm thấy mod-repo.yml trên target. Tiến hành tải..."
            curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3.raw" \
              -L "https://api.github.com/repos/BEACHEADVN/My-Assets/contents/ROM/repo/workflow-mod-repo.txt?ref=main" \
              -o .github/workflows/mod-repo.yml
            UPDATED=1
          fi
          
          echo "UPDATED=$UPDATED" >> $GITHUB_ENV
          echo "=========================================="

      - name: Push Workflows to Target Repository
        if: env.UPDATED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bat-link-tu-tracker.yml .github/workflows/mod-repo.yml
          git commit -m "Auto recovery missing tracker and mod-repo workflows from My-Assets"
          git push origin main

  # JOB 2: Chạy quét Tracker trên máy ảo của repo Multi-Download hiện tại
  update:
    needs: prepare-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: POCOF8Ultra
            codename: myron
            region: Europe
            output: pocof8ultra.json
          - device: REDMIK90ProMax
            codename: myron
            region: China
            output: redmik90promax.json

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install telethon
          fi

      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          printf "%s" "$TELEGRAM_SESSION" | base64 -d > telegram_session.session

      - name: Create config.json
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cat > config.json <<EOF
          {
            "api_id": ${API_ID},
            "api_hash": "${API_HASH}",
            "channel": "TECH_MUKUL",
            "search_limit": 30,
            "output_dir": "output"
          }
          EOF

      - name: Run tracker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python .github/workflows/telegram/hyperos.py \
            --device "${{ matrix.device }}" \
            --codename "${{ matrix.codename }}" \
            --region "${{ matrix.region }}" \
            --output "${{ matrix.output }}"

      - name: Trigger Build in Xiaomi-Stocktoolbuild Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ROM_URL=$(python3 -c "import json; print(json.load(open('${{ matrix.output }}'))['downloads']['recovery']['official'])")
          DEVICE_NAME="${{ matrix.device }}"
          
          if [ "$ROM_URL" != "None" ] && [ ! -z "$ROM_URL" ]; then
            echo "🚀 Triggering target repository for $DEVICE_NAME"
            echo "ROM URL: $ROM_URL"
            
            # Đoạn này bắn repository_dispatch -> bat-link-tu-tracker.yml tự bắt lấy và chạy tiếp
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/BEACHEADVN/nothingsvn_xiaomi-stocktoolbuild/dispatches \
              -d "{\"event_type\":\"trigger_from_tracker\",\"client_payload\":{\"device\":\"$DEVICE_NAME\",\"rom_url\":\"$ROM_URL\"}}"
          else
            echo "No ROM URL found. Skip trigger."
          fi

      - name: Commit changes (Multi-Download Repo)
        run: |
          if git diff --quiet; then
            echo "No changes in Multi-Download repo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update HyperOS JSON logs [${{ matrix.device }}]"
          git pull --rebase origin main
          git push
