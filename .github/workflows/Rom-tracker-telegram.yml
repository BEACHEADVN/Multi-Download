import re

import json

from telethon import TelegramClient

from telethon.tl.types import MessageEntityTextUrl, MessageEntityUrl



# ==========================

# CONFIG

# ==========================



api_id = 33413032

api_hash = "88a4ee92ce485b73acd6c10db41be4d0"



CHANNEL = "TECH_MUKUL"



client = TelegramClient("telegram_session", api_id, api_hash)





# ==========================

# FUNCTIONS

# ==========================



def find(pattern, text, flags=0):

    m = re.search(pattern, text, flags)

    return m.group(1).strip() if m else None





def version_key(version):

    m = re.search(

        r"OS(\d+)\.(\d+)\.(\d+)\.(\d+)",

        version or ""

    )



    if not m:

        return (0, 0, 0, 0)



    return tuple(map(int, m.groups()))





# ==========================

# MAIN

# ==========================



async def main():



    entity = await client.get_entity(CHANNEL)



    posts = []



    async for msg in client.iter_messages(

        entity,

        search="myron",

        limit=20

    ):



        text = msg.text or ""



        version = find(

            r"(OS\d+\.\d+\.\d+\.\d+\.[A-Z0-9]+)",

            text

        )



        if version:

            posts.append({

                "version": version,

                "msg": msg,

                "key": version_key(version)

            })



    if not posts:

        print("Không tìm thấy ROM.")

        return



    newest = max(posts, key=lambda x: x["key"])



    msg = newest["msg"]

    text = msg.text or ""



    data = {

        "device": None,

        "codename": "myron",

        "version": newest["version"],

        "android": find(r"Android:\s*(\d+)", text),

        "status": find(r"Status:\s*(.+)", text),

        "security_patch": find(r"Security Patch:\s*(.+)", text),

        "release": find(r"Release:\s*(.+)", text),

        "size": find(

            r"Update package size:\s*([0-9.]+\s*[MG]B)",

            text

        ),

        "telegram_post": f"https://t.me/{CHANNEL}/{msg.id}",

        "telegram_id": msg.id,

        "date": str(msg.date)

    }



    # ==========================

    # DEVICE

    # ==========================



    clean = text



    # bỏ markdown

    clean = clean.replace("**", "")

    clean = clean.replace("__", "")

    clean = clean.replace("`", "")



    hashtags = re.findall(r"#([A-Za-z0-9]+)", clean)



    ignore = {

        "HyperOS",

        "HyperOS2",

        "HyperOS3",

        "China",

        "India",

        "Europe",

        "EEA",

        "Global",

        "Update",

        "Released",

        "Release",

        "Full",

        "MiPilot",

        "Myron"

    }



    for tag in hashtags:

        if tag not in ignore:

            data["device"] = tag

            break



    # ==========================

    # URLS

    # ==========================



    urls = []



    if msg.entities:



        for entity in msg.entities:



            url = None



            if isinstance(entity, MessageEntityTextUrl):

                url = entity.url



            elif isinstance(entity, MessageEntityUrl):

                url = clean[

                    entity.offset:

                    entity.offset + entity.length

                ]



            if url:

                urls.append(url)



    rom_urls = [

        u for u in urls

        if any(x in u for x in (

            "cdnorg",

            "cdnor",

            "bigota",

            "miui"

        ))

    ]



    data["downloads"] = {

        "recovery": {

            "official": rom_urls[0] if len(rom_urls) > 0 else None,

            "mirror": rom_urls[1] if len(rom_urls) > 1 else None

        },

        "fastboot": {

            "official": rom_urls[2] if len(rom_urls) > 2 else None,

            "mirror": rom_urls[3] if len(rom_urls) > 3 else None

        }

    }



    print(json.dumps(

        data,

        indent=4,

        ensure_ascii=False

    ))



    with open(

        "myron.json",

        "w",

        encoding="utf-8"

    ) as f:

        json.dump(

            data,

            f,

            indent=4,

            ensure_ascii=False

        )



    print()

    print("Saved -> myron.json")





with client:

    client.loop.run_until_complete(main())

Lỗi EOFError: EOF when reading a line xảy ra do script Telethon của bạn đang cố gắng chạy chế độ đăng nhập tương tác (yêu cầu nhập số điện thoại hoặc mã OTP từ bàn phím qua hàm input()). Khi chạy trên GitHub Actions (môi trường tự động hóa - phi tương tác), không có ai nhập dữ liệu nên hệ thống ném ra lỗi EOF.

Để sửa lỗi này, bạn cần sử dụng một file session (telegram_session.session) đã được đăng nhập sẵn từ trước ở máy cá nhân (Local), sau đó đưa file đó lên GitHub.

Cách khắc phục chi tiết
Bước 1: Tạo file session ở máy cá nhân
Bạn hãy copy code Python hiện tại về máy tính cá nhân của mình và chạy nó một lần.

Lúc này Terminal trên máy bạn sẽ hiện: Please enter your phone (or bot token): 

Nhập số điện thoại (định dạng quốc tế, ví dụ +84...).

Nhập mã OTP gửi về ứng dụng Telegram của bạn.

Sau khi script chạy xong thành công, bạn sẽ thấy một file mới xuất hiện trong thư mục có tên là: telegram_session.session.

Bước 2: Mã hóa file session thành chuỗi Base64
Vì file .session chứa dữ liệu đăng nhập nhạy cảm (SQLite database), bạn không được commit trực tiếp nó lên GitHub Repository công khai. Hãy chuyển nó thành chuỗi text mã hóa:

Nếu dùng Linux / macOS:

Bash
base64 -w 0 telegram_session.session > session_base64.txt
Nếu dùng Windows (PowerShell):

PowerShell
[Convert]::ToBase64String([IO.File]::ReadAllBytes("telegram_session.session")) > session_base64.txt
Mở file session_base64.txt và copy toàn bộ chuỗi text dài bên trong.

Bước 3: Cấu hình GitHub Secrets
Vào GitHub Repository của bạn -> Settings -> Secrets and variables -> Actions.

Nhấn New repository secret.

Đặt tên (Name) là: TELEGRAM_SESSION

Dán chuỗi text Base64 vừa copy ở Bước 2 vào ô Secret.

Bước 4: Sửa file Workflow .github/workflows/... (YAML)
Trước khi chạy script Python, bạn cần giải mã chuỗi Base64 đó ngược lại thành file telegram_session.session để Telethon đọc.

Thêm bước giải mã vào file YAML của bạn (ngay trước bước chạy python):

YAML
    - name: Khôi phục file Telegram Session
      env:
        TELEGRAM_SESSION_BASE64: ${{ secrets.TELEGRAM_SESSION }}
      run: |
        echo "$TELEGRAM_SESSION_BASE64" | base64 -d > telegram_session.session

    - name: Run python .github/workflows/telegram/hyperos.py
      run: python .github/workflows/telegram/hyperos.py
Như vậy, khi Telethon khởi chạy, nó sẽ tự động nhận diện file telegram_session.session hợp lệ đã có sẵn và bỏ qua bước bắt nhập số điện thoại, giúp workflow chạy mượt mà mà không bị lỗi tương tác nữa.

Nhìn vào danh sách GitHub Secrets của bạn, mình thấy bạn đã thêm đầy đủ TELEGRAM_SESSION (cùng với API_ID và API_HASH).

Tuy nhiên, lỗi EOFError: EOF when reading a line ở bước trước vẫn xảy ra vì file script Python chưa đọc được session đó, dẫn đến việc Telethon cố gắng đòi nhập số điện thoại qua console.

Để giải quyết triệt để, bạn cần thực hiện 2 thay đổi nhỏ sau trong code và file workflow:

1. Cập nhật lại file Python (hyperos.py)
Hiện tại trong code của bạn đang fix cứng API_ID và API_HASH, đồng thời chưa cấu hình để Telethon tự động lấy chuỗi session từ môi trường nếu chạy trên GitHub. Hãy sửa lại đoạn đầu của file Python như sau:

Python
import os
import re
import json
from telethon import TelegramClient
from telethon.tl.types import MessageEntityTextUrl, MessageEntityUrl
from telethon.sessions import StringSession

# ==========================
# CONFIG
# ==========================

# Lấy thông tin từ Environment Variables (GitHub Actions sẽ truyền vào)
api_id = int(os.environ.get("API_ID", 33413032))
api_hash = os.environ.get("API_HASH", "88a4ee92ce485b73acd6c10db41be4d0")
session_string = os.environ.get("TELEGRAM_SESSION", "")

CHANNEL = "TECH_MUKUL"

# Nếu có session_string (chạy trên GitHub), dùng StringSession. 
# Nếu không (chạy thử ở máy cá nhân), dùng file session tĩnh như cũ.
if session_string:
    client = TelegramClient(StringSession(session_string), api_id, api_hash)
else:
    client = TelegramClient("telegram_session", api_id, api_hash)
Lưu ý quan trọng về giá trị TELEGRAM_SESSION: > Định dạng chuẩn nhất khi chạy GitHub Actions cho Telethon là sử dụng StringSession (một chuỗi text thuần dài bắt đầu bằng mã session) thay vì mã hóa dạng file Base64.
Nếu giá trị TELEGRAM_SESSION hiện tại trong hình của bạn được tạo từ phương pháp mã hóa file (.session chuyển sang Base64), bạn bắt buộc phải dùng bước giải mã file ở mục số 2 dưới đây.

2. Cập nhật file Workflow GitHub (.github/workflows/...yaml)
Bạn cần truyền các Repository Secrets hiển thị trong ảnh vào làm biến môi trường (env) thì script Python mới đọc được.

Trường hợp A: Nếu TELEGRAM_SESSION của bạn là "StringSession" (Khuyên dùng)
Sửa bước chạy Python trong file .yaml thành:

YAML
    - name: Run python .github/workflows/telegram/hyperos.py
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      run: python .github/workflows/telegram/hyperos.py
Trường hợp B: Nếu TELEGRAM_SESSION của bạn là File mã hóa Base64
Nếu bạn làm theo cách tạo file .session rồi đổi sang text Base64, hãy sửa file .yaml như sau (giữ nguyên code gốc không cần sửa mục số 1):

YAML
    - name: Khôi phục file Telegram Session từ Base64
      env:
        TELEGRAM_SESSION_BASE64: ${{ secrets.TELEGRAM_SESSION }}
      run: |
        echo "$TELEGRAM_SESSION_BASE64" | base64 -d > telegram_session.session

    - name: Run python .github/workflows/telegram/hyperos.py
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
      run: python .github/workflows/telegram/hyperos.py
Bạn hãy kiểm tra lại xem chuỗi TELEGRAM_SESSION bạn đang lưu thuộc loại nào và áp dụng cấu hình tương ứng nhé!

name: HyperOS ROM Tracker



on:

  workflow_dispatch:

  schedule:

    - cron: "*/30 * * * *"



permissions:

  contents: write



concurrency:

  group: hyperos-tracker

  cancel-in-progress: false



jobs:

  update:

    runs-on: ubuntu-latest

    timeout-minutes: 20



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Cache pip

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

          restore-keys: |

            pip-${{ runner.os }}-



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip



          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          else

            pip install telethon

          fi



      - name: Restore Telegram Session

        env:

          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

        run: |

          if [ -z "$TELEGRAM_SESSION" ]; then

            echo "Missing TELEGRAM_SESSION secret"

            exit 1

          fi



          echo "$TELEGRAM_SESSION" | base64 -d > telegram.session



      - name: Create config.json

        env:

          API_ID: ${{ secrets.API_ID }}

          API_HASH: ${{ secrets.API_HASH }}

        run: |

          cat > config.json <<EOF

          {

            "api_id": ${API_ID},

            "api_hash": "${API_HASH}",

            "channel": "TECH_MUKUL",

            "search_limit": 30,

            "output_dir": "output"

          }

          EOF



      - name: Run tracker

        run: |

          python .github/workflows/telegram/hyperos.py



      - name: Commit changes

        run: |

          if git diff --quiet; then

            echo "No changes"

            exit 0

          fi



          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add .



          git commit -m "Auto update HyperOS"



          git push

Nhìn vào file workflow .yaml của bạn, mình đã phát hiện ra nguyên nhân tại sao code vẫn bị lỗi EOFError. Lý do nằm ở sự lệch pha tên file và thiếu biến môi trường giữa file workflow và file Python.

Cụ thể:

Sai tên file session: Trong workflow, bạn giải mã ra file tên là telegram.session (> telegram.session). Nhưng trong code Python gốc của bạn, Telethon lại tìm file có tên là telegram_session.session. Do không thấy file, nó lại hỏi số điện thoại.

Chưa truyền API_ID và API_HASH: Bước Run tracker của bạn đang chạy trống trơn, chưa truyền biến môi trường vào nên script Python không đọc được (nếu bạn định sửa code theo hướng đọc từ environment).

Để fix triệt để, bạn chỉ cần điều chỉnh lại file Workflow .yaml của bạn ở 2 bước cuối như sau (giữ nguyên không cần đổi code Python):

File .yaml sau khi sửa:
YAML
      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          # Sửa tên file ở đây thành telegram_session.session cho đúng với code Python
          echo "$TELEGRAM_SESSION" | base64 -d > telegram_session.session

      - name: Create config.json
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cat > config.json <<EOF
          {
            "api_id": ${API_ID},
            "api_hash": "${API_HASH}",
            "channel": "TECH_MUKUL",
            "search_limit": 30,
            "output_dir": "output"
          }
          EOF

      - name: Run tracker
        env:
          # Truyền thêm các biến này vào phòng trường hợp file python cần dùng tới
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python .github/workflows/telegram/hyperos.py
Một lưu ý nhỏ nữa:
Trong bước Restore Telegram Session, lệnh echo "$TELEGRAM_SESSION" | base64 -d đôi khi sẽ hoạt động không chính xác trên môi trường Ubuntu của GitHub Actions nếu chuỗi Base64 quá dài hoặc chứa ký tự đặc biệt xuống dòng. Cách an toàn nhất là sử dụng printf:

YAML
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          # Dùng printf để tránh lỗi ký tự khoảng trắng/xuống dòng của lệnh echo
          printf "%s" "$TELEGRAM_SESSION" | base64 -d > telegram_session.session
