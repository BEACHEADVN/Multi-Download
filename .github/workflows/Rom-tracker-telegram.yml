name: HyperOS ROM Tracker
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: hyperos-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: POCOF8Ultra
            codename: myron
            region: Europe
            output: pocof8ultra.json
          - device: REDMIK90ProMax
            codename: myron
            region: China
            output: redmik90promax.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install telethon
          fi

      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "Missing TELEGRAM_SESSION secret"
            exit 1
          fi
          printf "%s" "$TELEGRAM_SESSION" | base64 -d > telegram_session.session

      - name: Create config.json
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cat > config.json <<EOF
          {
            "api_id": ${API_ID},
            "api_hash": "${API_HASH}",
            "channel": "TECH_MUKUL",
            "search_limit": 30,
            "output_dir": "output"
          }
          EOF

      - name: Run tracker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python .github/workflows/telegram/hyperos.py \
            --device "${{ matrix.device }}" \
            --codename "${{ matrix.codename }}" \
            --region "${{ matrix.region }}" \
            --output "${{ matrix.output }}"

      - name: Trigger Build in Xiaomi-Toolbuild Repo
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          ROM_URL=$(python3 -c "import json; print(json.load(open('${{ matrix.output }}'))['downloads']['recovery']['official'])")
          DEVICE_NAME="${{ matrix.device }}"
          
          if [ "$ROM_URL" != "None" ] && [ ! -z "$ROM_URL" ]; then
            echo "🚀 Trigger $DEVICE_NAME"
            echo "$ROM_URL"
            
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/BEACHEADVN/nothingsvn_xiaomi-toolbuild/dispatches \
              -d "{\"event_type\":\"trigger_from_tracker\",\"client_payload\":{\"device\":\"$DEVICE_NAME\",\"rom_url\":\"$ROM_URL\"}}"
          else
            echo "No ROM URL found."
          fi

      # =======================================================================
      # BƯỚC TỰ ĐỘNG CLONE, ĐÈ FILE GỐC TIENCV2006 VÀ SỬA ĐỔI UPLOADROM.SH (ĐÃ FIX MATRIX)
      # =======================================================================
      - name: Overwrite and Patch Remote uploadROM.sh
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          echo "Cloning nothingsvn_xiaomi-toolbuild..."
          git clone https://x-access-token:${GH_TOKEN}@github.com/BEACHEADVN/nothingsvn_xiaomi-toolbuild.git target_repo
          
          cd target_repo
          
          echo "Downloading upstream uploadROM.sh from tiencv2006 to overwrite..."
          curl -sL "https://raw.githubusercontent.com/tiencv2006/nothingsvn_xiaomi-toolbuild/main/uploadROM.sh" -o uploadROM.sh
          
          echo "Patching uploadROM.sh..."
          # 1. Loại bỏ các dòng 'exit 1' nằm trong cụm lỗi rclone
          sed -i '/rclone -v --config/!b;n;n;s/exit 1//' uploadROM.sh
          
          # 2. Vô hiệu hóa (comment out) hai dòng rm -rf out và build
          sed -i 's|rm -rf $work_dir/out|# rm -rf $work_dir/out|g' uploadROM.sh
          sed -i 's|rm -rf $work_dir/build|# rm -rf $work_dir/build|g' uploadROM.sh
          
          # Cấu hình Git thông tin bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Đẩy thay đổi lên repo chính nếu có khác biệt
          if ! git diff --quiet; then
            git add uploadROM.sh
            git commit -m "workflow: sync uploadROM.sh from tiencv2006 and patch modifications"
            
            # Xử lý tranh chấp luồng song song: Thử push, nếu fail thì rebase, nếu vẫn fail thì bỏ qua êm đẹp
            git push origin main || {
                echo "⚠️ Push failed due to parallel matrix race. Retrying with rebase..."
                git pull --rebase origin main
                git push origin main
            } || {
                echo "❌ File already updated by the other matrix branch. Skipping safely."
                git reset --hard origin/main
            }
            echo "Finished uploadROM.sh processing step."
          else
            echo "No changes detected."
          fi
          
          cd ..
          rm -rf target_repo

      - name: Commit changes (Multi-Download Repo)
        run: |
          if git diff --quiet; then
            echo "No changes in Multi-Download repo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update HyperOS"
          git push
