name: Fast Auto Update Devices JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process JSON (Fastest Method)
        run: |
          LOCAL_FILE="bin/ddevice/data/devices.json"
          URL="https://raw.githubusercontent.com/tiencv2006/nothingsvn_xiaomi-stocktoolbuild/main/bin/ddevice/data/devices.json"
          
          # 1. Tải file từ repo gốc về
          curl -s "$URL" > target_devices.json
          
          # Kiểm tra xem file tải về có hợp lệ không
          if [ ! -s target_devices.json ]; then
            echo "Lỗi: Không tải được file hoặc file rỗng."
            exit 1
          fi

          # 2. Xử lý chèn dòng Myron trước dòng Natrium bằng AWK (Tốc độ ánh sáng)
          # Tự động tính toán số khoảng trắng thụt lề (indent) của dòng natrium để áp dụng cho dòng myron
          awk '
            /natrium/ && !inserted {
              match($0, /^[ \t]*/)
              indent = substr($0, RSTART, RLENGTH)
              print indent "\"myron\": \"Redmi K90 Pro Max|POCO F8 Ultra\","
              inserted = 1
            }
            { print }
          ' target_devices.json > processed_devices.json

          # 3. So sánh trực tiếp file vừa xử lý với file hiện tại trong repo fork
          if [ -f "$LOCAL_FILE" ] && cmp -s processed_devices.json "$LOCAL_FILE"; then
            echo "MATCH=true" >> $GITHUB_ENV
            echo "Không có thay đổi nào mới. Bỏ qua commit."
          else
            echo "MATCH=false" >> $GITHUB_ENV
            mkdir -p "$(dirname "$LOCAL_FILE")"
            mv processed_devices.json "$LOCAL_FILE"
            echo "Đã ghi đè dữ liệu mới vào $LOCAL_FILE"
          fi

      - name: Commit and Push to this Repository
        if: env.MATCH == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/ddevice/data/devices.json
          git commit -m "Fast auto update devices.json with myron patch"
          git push
