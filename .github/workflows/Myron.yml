name: Auto Find and Download Latest MyROM
on:
  workflow_dispatch:

jobs:
  download-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cài đặt thư viện kết nối Google Drive chính thức
      - name: Install Google API Client
        run: |
          pip install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Get Latest File and Download
        id: gdrive
        run: |
          set -e
          
          # ID thư mục con cuối cùng từ link của bạn
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          
          echo "=== ĐANG QUÉT DANH SÁCH FILE TRÊN GOOGLE DRIVE ==="
          
          # Chạy script Python để lấy file mới nhất và tải về mà không cần API key
          python -c "
          import urllib.request
          import json
          import os
          import sys

          folder_id = '$FOLDER_ID'
          # Sử dụng API công khai của Google Drive để lấy danh sách file, sắp xếp theo ngày chỉnh sửa giảm dần
          url = f'https://www.googleapis.com/drive/v3/files?q=%27{folder_id}%27+in+parents+and+trashed%3Dfalse&orderBy=modifiedTime+desc&fields=files(id,name,size)&key='
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
              
              files = data.get('files', [])
              if not files:
                  print('ERROR: Không tìm thấy file nào trong thư mục!')
                  sys.exit(1)
              
              # Do đã chọn orderBy=modifiedTime desc nên file đầu tiên chắc chắn là bản mới nhất
              latest_file = files[0]
              file_id = latest_file['id']
              file_name = latest_file['name']
              
              print('-------------------------------------------------------')
              print(f'🎯 ĐÃ TÌM THẤY FILE MYROM MỚI NHẤT:')
              print(f'Tên file: {file_name}')
              print(f'ID Google Drive: {file_id}')
              print('-------------------------------------------------------')
              
              # Tiến hành tải file
              print('=== TIẾN HÀNH TẢI FILE ===')
              download_url = f'https://www.googleapis.com/drive/v3/files/{file_id}?alt=media'
              
              # Ghi tên file ra file tạm để bash nhận diện sau khi kết thúc python
              with open('target_file.txt', 'w') as f:
                  f.write(f'{file_id}|{file_name}')
                  
          except Exception as e:
              print(f'Lỗi kết nối API: {e}')
              sys.exit(1)
          "

          # Đọc dữ liệu từ script Python xử lý
          LATEST_INFO=$(cat target_file.txt)
          FILE_ID=$(echo "$LATEST_INFO" | cut -d'|' -f1)
          FILE_NAME=$(echo "$LATEST_INFO" | cut -d'|' -f2)

          # Tải file trực tiếp bằng curl (rất nhanh và không sợ lỗi gdown)
          curl -L -o "$FILE_NAME" "https://www.googleapis.com/drive/v3/files/$FILE_ID?alt=media"

          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "Tải thành công: $(ls -lh "$FILE_NAME")"

      - name: Verify Downloaded File
        run: |
          echo "File vừa được tải về thành công là: ${{ steps.gdrive.outputs.filename }}"
