name: Auto Find and Download Latest MyROM
on:
  workflow_dispatch: # Chạy bằng tay khi cần

jobs:
  download-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Get Latest File and Download
        id: gdrive
        run: |
          set -e
          
          # ID thư mục con cuối cùng trích xuất từ link Google Drive của bạn
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          
          echo "=== ĐANG QUÈT DANH SÁCH FILE TRÊN GOOGLE DRIVE ==="
          
          # Sử dụng gdown để liệt kê toàn bộ các file trong thư mục lưu thành file JSON
          gdown --id "$FOLDER_ID" --remaining-ok --list > folder_contents.json
          
          # Phân tích cú pháp file JSON bằng Python để tìm file mới nhất dựa trên tên hoặc ngày tháng
          # Kịch bản này ưu tiên tìm file đuôi .zip có số phiên bản lớn nhất hoặc ngày mới nhất
          LATEST_FILE_ID=$(python -c '
          import json, os
          with open("folder_contents.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          
          # Lọc ra danh sách các file (bỏ qua thư mục con nếu có)
          files = [item for item in data if not item.get("is_folder", False)]
          
          if not files:
              print("NOT_FOUND")
              exit()
          
          # Sắp xếp các file theo thứ tự bảng chữ cái/ngày tháng tăng dần (Tên file ROM thường chứa số phiên bản tăng dần)
          # File cuối cùng sau khi sắp xếp sẽ là bản mới nhất
          files.sort(key=lambda x: x.get("name", ""))
          latest_file = files[-1]
          
          # Trả về chuỗi định dạng: FILE_ID|FILE_NAME
          print(f"{latest_file['id']}|{latest_file['name']}")
          ')

          if [ "$LATEST_FILE_ID" == "NOT_FOUND" ] || [ -z "$LATEST_FILE_ID" ]; then
            echo "❌ Lỗi: Không tìm thấy file nào trong thư mục Google Drive này!"
            exit 1
          fi

          # Tách ID và Tên file ra làm các biến riêng biệt
          FILE_ID=$(echo "$LATEST_FILE_ID" | cut -d'|' -f1)
          FILE_NAME=$(echo "$LATEST_FILE_ID" | cut -d'|' -f2)

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ TÌM THẤY FILE MYROM MỚI NHẤT:"
          echo "Tên file: $FILE_NAME"
          echo "ID Google Drive: $FILE_ID"
          echo "-------------------------------------------------------"

          echo "=== TIẾN HÀNH TẢI FILE ==="
          # Thực hiện tải file trực tiếp về runner của GitHub Actions
          gdown --id "$FILE_ID" -O "$FILE_NAME" --remaining-ok

          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "Tải thành công: $(ls -lh "$FILE_NAME")"

      # Bước kế thừa này giúp bạn tái sử dụng tên file để check Pixeldrain hoặc làm việc khác
      - name: Verify Downloaded File
        run: |
          echo "File vừa được tải về thành công là: ${{ steps.gdrive.outputs.filename }}"
