name: Google Drive ROM Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  rom:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MyronTN
            folder: 1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m
          - name: MyronHyperUR
            folder: 1ETXIK5W2zA4OHyJdIA9us7AZVULZeQxP

          - name: SocratesTN
            folder: 1NloAevz_eLBLBsWlGuCYageoTia3MfSm
          - name: SocratesHyperUR
            folder: 15EWCyEYYWcNEAovxdAljMg2_rPZfw6dD

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      - name: Parse Folder and Find Latest
        id: gdrive
        run: |
          set -e
      
          FOLDER_ID="${{ matrix.folder }}"
      
          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"
      
          rclone lsf source_rom:/ \
            --files-only \
            --format "tp" \
            > files.txt
      
          FILE_NAME=$(sort files.txt | tail -n1)
      
          if [ -z "$FILE_NAME" ]; then
            echo "No ROM found"
            exit 1
          fi
      
          echo "Latest: $FILE_NAME"
      
          echo "file=$FILE_NAME" >> $GITHUB_OUTPUT

      # ===== CHECK STATE =====
      - name: Check Uploaded State
        id: check
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          STATE_FILE="rom_uploaded.txt"

          touch "$STATE_FILE"

          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | head -n1 | cut -d'|' -f2)

            RESPONSE=$(curl -s "https://pixeldrain.com/api/file/$ID/info")
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

            if [ "$SUCCESS" = "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Already uploaded"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Missing -> reupload"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New ROM"
          fi

      - name: Download ROM
        if: steps.check.outputs.skip != 'true'
        run: |
          FILE_NAME="${{ steps.gdrive.outputs.file }}"
          FOLDER_ID="${{ matrix.folder }}"
      
          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"
      
          rclone copy source_rom:/ . \
            --include "$FILE_NAME" \
            --drive-acknowledge-abuse \
            --progress
      
            # ===== VERIFY =====
            - name: Verify Downloaded File
              if: steps.check.outputs.skip != 'true'
              run: |
                ls -lh "${{ steps.gdrive.outputs.file }}"

      # ===== UPLOAD =====
      - name: Upload to Pixeldrain
        if: steps.check.outputs.skip != 'true'
        id: pd
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"

          RESPONSE=$(curl -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$ID" = "null" ] || [ -z "$ID" ]; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT

      # ===== TELEGRAM =====
      - name: Telegram Notify
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          LINK="${{ steps.pd.outputs.link }}"

          TEXT="<b>🚀 New ${{ matrix.name }} Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      - name: Save State
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="${{ steps.gdrive.outputs.file }}"
          ID="${{ steps.pd.outputs.id }}"

          for i in {1..10}; do
            git fetch origin main
            git reset --hard origin/main

            touch rom_uploaded.txt
            sed -i "\|^$FILE|d" rom_uploaded.txt
            echo "$FILE|$ID" >> rom_uploaded.txt

            sort -u rom_uploaded.txt -o rom_uploaded.txt

            git add rom_uploaded.txt
            git commit -m "Update ${{ matrix.name }}: $FILE" || true

            if git push origin main; then
              exit 0
            fi

            sleep 3
          done

          exit 1
