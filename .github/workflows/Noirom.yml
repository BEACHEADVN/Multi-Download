name: EU nối rom

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt công cụ (aria2 & unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip

      # ===== TIẾN HÀNH TẢI ROM TRỰC TIẾP TỪ PIXELDRAIN =====
      - name: Download ROM from Pixeldrain
        run: |
          URL="https://pixeldrain.com/api/file/cmhSDVRw"
          echo "📥 Đang tải file từ Pixeldrain..."
          
          # Tải xuống và đặt tên cố định là eu_baserom.zip cho dễ xử lý ở bước sau
          aria2c \
            -x 16 \
            -s 16 \
            -k 1M \
            --continue=true \
            -o "eu_baserom.zip" \
            "$URL"
            
          echo "✅ Tải thành công! Chi tiết file trên đĩa:"
          ls -lh "eu_baserom.zip"

      # ===== GIẢI NÉN VÀ HIỂN THỊ CẤU TRÚC THƯ MỤC =====
      - name: Extract ROM & List Directories
        run: |
          ROM_ZIP="eu_baserom.zip"
          EXTRACT_DIR="extracted_rom"
          
          echo "📂 Đang giải nén file $ROM_ZIP vào thư mục $EXTRACT_DIR..."
          mkdir -p "$EXTRACT_DIR"
          
          # Giải nén không hiện log tràn màn hình (-q)
          unzip -q "$ROM_ZIP" -d "$EXTRACT_DIR"
          echo "✅ Giải nén hoàn tất!"
          
          # Xóa file zip gốc ngay để tránh tràn dung lượng đĩa ảo GitHub
          rm -f "$ROM_ZIP"
          echo "🧹 Đã xóa file ZIP gốc để giải phóng đĩa."
          
          echo "=========================================="
          echo "       THÔNG TIN THƯ MỤC SAU KHI GIẢI NÉN  "
          echo "=========================================="
          # Liệt kê toàn bộ file và thư mục con bên trong
          cd "$EXTRACT_DIR"
          ls -R
