name: XiaomiEU Super Combiner & Unpacker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt công cụ hệ thống (simg2img & lpunpack)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip android-sdk-libsparse-utils

      # ===== 1. TẢI ROM TRỰC TIẾP TỪ PIXELDRAIN =====
      - name: Download ROM from Pixeldrain
        run: |
          URL="https://pixeldrain.com/u/cmhSDVRw?download"
          echo "📥 Đang tải trực tiếp ROM từ Pixeldrain..."
          
          aria2c \
            -x 16 \
            -s 16 \
            -k 1M \
            --continue=true \
            -o "eu_baserom.zip" \
            "$URL"
            
          echo "✅ Tải thành công!"

      # ===== 2. CHỈ TRÍCH XUẤT THƯ MỤC IMAGES CHỨA SUPER =====
      - name: Extract Sparse Super Images
        run: |
          echo "📂 Đang trích xuất các mảnh super.img.*..."
          unzip -q "eu_baserom.zip" "images/super.img.*" -d "extracted_rom"
          
          echo "🧹 Xóa ngay file zip gốc để tránh đầy đĩa..."
          rm -f "eu_baserom.zip"

      # ===== 3. GỘP THÀNH SUPER.IMG DUY NHẤT =====
      - name: Combine Sparse Images into Single Super.img
        run: |
          TARGET_DIR="extracted_rom/images"
          
          echo "⚡ Tiến hành gộp các mảnh sparse thành raw image..."
          simg2img ${TARGET_DIR}/super.img.[0-9]* super.img
          
          if [ -f "super.img" ]; then
            echo "✅ Hợp nhất THÀNH CÔNG!"
            ls -lh super.img
            rm -rf extracted_rom  # Xóa các mảnh nhỏ ngay lập tức để lấy lại dung lượng
          else
            echo "❌ LỖI: Không gộp được file super.img!"
            exit 1
          fi

      # ===== 4. KIỂM TRA THÔNG TIN BẢNG PHÂN VÙNG (LPDUMP) =====
      - name: Dump Super Image Info
        run: |
          echo "=========================================="
          echo "       CẤU TRÚC PHÂN VÙNG LOGIC (LPDUMP)  "
          echo "=========================================="
          # Xem thông tin kích thước và các phân vùng con chứa bên trong file super raw
          lpdump super.img || echo "⚠️ Không thể dump thông tin nhưng vẫn tiến hành unpack."

      # ===== 5. KHỞI CHẠY LPUNPACK XẢ PHÂN VÙNG =====
      - name: Unpack Super Image (lpunpack)
        run: |
          echo "🔓 Khởi chạy lpunpack để rã file super.img..."
          mkdir -p unpacked_partitions
          
          # Thực hiện lệnh unpack chính xác vào thư mục đích
          lpunpack super.img unpacked_partitions/
          
          echo "✅ Đã unpack hoàn tất!"
          echo "🧹 Xóa file raw super.img khổng lồ để giải phóng không gian đĩa..."
          rm -f super.img

      # ===== 6. HIỂN THỊ THÀNH QUẢ SAU KI UNPACK =====
      - name: Display Unpacked Partitions
        run: |
          echo "=========================================="
          echo "     DANH SÁCH PHÂN VÙNG SAU KHI UNPACK   "
          echo "=========================================="
          cd unpacked_partitions
          ls -lh
