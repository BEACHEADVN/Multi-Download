name: Auto Find and Download Latest MyROM
on:
  workflow_dispatch:

jobs:
  download-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Folder and Get Latest File
        id: gdrive
        run: |
          set -e
          
          # ID thư mục từ link của bạn
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          
          echo "=== ĐANG TẢI THƯ MỤC TỪ GOOGLE DRIVE ==="
          mkdir -p myrom_folder
          
          # SỬA TẠI ĐÂY: Bỏ hoàn toàn --id và --remaining-ok, truyền trực tiếp FOLDER_ID vào cuối
          gdown --folder -O myrom_folder "$FOLDER_ID"

          echo "=== TÌM KIẾM FILE MỚI NHẤT TRONG THƯ MỤC ==="
          cd myrom_folder
          
          # Lấy file .zip mới nhất dựa theo thời gian chỉnh sửa (ls -t đưa file mới nhất lên đầu)
          FILE_NAME=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          
          # Nếu không có file .zip, lấy file bất kỳ mới nhất
          if [ -z "$FILE_NAME" ]; then
            FILE_NAME=$(ls -t | head -n 1)
          fi

          if [ -z "$FILE_NAME" ]; then
            echo "❌ Lỗi: Thư mục tải về trống rỗng!"
            exit 1
          fi

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ TÌM THẤY FILE MYROM MỚI NHẤT TRONG FOLDER:"
          echo "Tên file: $FILE_NAME"
          echo "Dung lượng: $(ls -lh "$FILE_NAME" | awk '{print $5}')"
          echo "-------------------------------------------------------"

          # Đẩy file ra thư mục gốc để các step sau dễ sử dụng
          mv "$FILE_NAME" ../
          cd ../

          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "File sẵn sàng xử lý: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
