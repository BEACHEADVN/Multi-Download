name: Test Find and Download First File
on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Parse Folder and Download First File
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE SỬ DỤNG GDOWN ==="
          # Giới hạn gdown chạy trong 15 giây để nó kịp in cây danh sách file ra log
          timeout 15s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          echo "=== PHÂN TÍCH DANH SÁCH FILE THU ĐƯỢC ==="
          # Lọc các dòng chứa file thực tế từ log thô
          grep "Processing file" gdown_log.txt > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Lỗi: Không thể trích xuất danh sách file từ log. Dưới đây là log thô để debug:"
            cat gdown_log.txt
            exit 1
          fi

          echo "Danh sách các file tìm thấy trong thư mục:"
          cat files_list.txt

          # Bốc dòng đầu tiên (bản thấp nhất/file nhẹ) để test script
          FIRST_LINE=$(head -n 1 files_list.txt)
          
          # Tách lấy ID và Tên file từ log của gdown
          FILE_ID=$(echo "$FIRST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$FIRST_LINE" | cut -d' ' -f4-)

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ BỐC ĐƯỢC FILE ĐẦU TIÊN ĐỂ THỬ NGHIỆM:"
          echo "Tên file: $FILE_NAME"
          echo "ID File: $FILE_ID"
          echo "-------------------------------------------------------"

          echo "=== TIẾN HÀNH TẢI FILE (VƯỢT CẢNH BÁO FILE LỚN) ==="
          # Bước 1: Gửi request lấy mã confirm token và lưu cookie để xác nhận tải file dung lượng lớn
          CONFIRM=$(curl -s -c cookies.txt "https://docs.google.com/uc?export=download&id=$FILE_ID" | grep -o 'confirm=[^&]*' | head -n 1 || true)
          
          # Bước 2: Kiểm tra nếu có mã confirm thì đính kèm vào url để ép Google nhả file gốc
          if [ ! -z "$CONFIRM" ]; then
            echo "Tìm thấy mã xác nhận file lớn: $CONFIRM"
            curl -L -b cookies.txt -o "$FILE_NAME" "https://docs.google.com/uc?export=download&id=$FILE_ID&$CONFIRM"
          else
            echo "File nhỏ hoặc không yêu cầu mã, tải trực tiếp..."
            curl -L -b cookies.txt -o "$FILE_NAME" "https://docs.google.com/uc?export=download&id=$FILE_ID"
          fi

          # Dọn dẹp file tạm
          rm -f cookies.txt gdown_log.txt files_list.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
