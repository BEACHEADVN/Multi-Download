name: Test Find and Download First File
on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Parse Folder and Download First File
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE SỬ DỤNG GDOWN PARSER ==="
          
          # Dùng gdown xuất danh sách file trong thư mục ra một file text mà KHÔNG tải file về
          gdown --gdriveurl "https://drive.google.com/drive/folders/$FOLDER_ID" --remaining-ok | tee gdown_log.txt || true

          echo "=== PHÂN TÍCH DANH SÁCH FILE THU ĐƯỢC ==="
          
          # Trích xuất các dòng chứa thông tin file từ log của gdown
          # Nhật ký gdown có dạng: Processing file ID_FILE NAME_FILE
          grep "Processing file" gdown_log.txt > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Lỗi: gdown không thể đọc được cấu trúc thư mục. Vui lòng kiểm tra lại log phía trên."
            exit 1
          fi

          echo "Danh sách các file tìm thấy:"
          cat files_list.txt

          # Lấy dòng đầu tiên để test bản thấp/file nhẹ theo ý bạn
          FIRST_LINE=$(head -n 1 files_list.txt)
          
          # Cắt chuỗi lấy ID và Tên file (gdown xuất dạng: Processing file ID NAME)
          FILE_ID=$(echo "$FIRST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$FIRST_LINE" | cut -d' ' -f4-)

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ BỐC ĐƯỢC FILE ĐẦU TIÊN ĐỂ TEST:"
          echo "Tên file: $FILE_NAME"
          echo "ID File: $FILE_ID"
          echo "-------------------------------------------------------"

          echo "=== TIẾN HÀNH TẢI FILE TIÊU CHUẨN ==="
          # Tải file đơn lẻ này bằng curl cơ bản qua cổng export download
          curl -L -o "$FILE_NAME" "https://drive.google.com/uc?export=download&id=$FILE_ID"

          rm -f gdown_log.txt files_list.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
