name: Auto Find and Download Latest MyROM (Bypass Quota)
on:
  workflow_dispatch:

jobs:
  download-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Install rclone
        run: |
          echo "=== ĐANG CÀI ĐẶT RCLONE ==="
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Parse Folder and Process Download
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE SỬ DỤNG GDOWN ==="
          # Quét cấu trúc cây thư mục trong 15 giây để xuất danh sách file ra log
          timeout 15s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          echo "=== PHÂN TÍCH DANH SÁCH FILE MỚI NHẤT ==="
          # Chỉ lọc các dòng chứa file có đuôi .7z (loại bỏ hoàn toàn Readme.md)
          grep "Processing file" gdown_log.txt | grep "\.7z" > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Lỗi: Không thể trích xuất danh sách file ROM .7z từ log."
            exit 1
          fi

          echo "Danh sách các file ROM tìm thấy trong thư mục gốc:"
          cat files_list.txt
          echo "-------------------------------------------------------"

          # Chọn file ROM mới nhất nằm ở dòng cuối cùng (Bản OS3.0.305.0_20260505.7z)
          LATEST_LINE=$(tail -n 1 files_list.txt)
          
          FILE_ID=$(echo "$LATEST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$LATEST_LINE" | cut -d' ' -f4-)

          echo "🎯 ĐÃ XÁC ĐỊNH FILE MỚI NHẤT CẦN TẢI:"
          echo "Tên file: $FILE_NAME"
          echo "ID File gốc: $FILE_ID"
          echo "-------------------------------------------------------"

          # Khởi tạo cấu hình rclone trực tiếp qua biến môi trường sử dụng Token của bạn
          export RCLONE_CONFIG_MYDRIVE_TYPE="drive"
          export RCLONE_CONFIG_MYDRIVE_SCOPE="drive"
          export RCLONE_CONFIG_MYDRIVE_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'

          echo "=== KÍCH HOẠT THỦ THUẬT BYPASS QUOTA LIMIT ==="
          echo "Tiến hành nhân bản file dính giới hạn sang Drive cá nhân của bạn..."
          
          # Thực hiện copy nội bộ trên server của Google (mất chưa tới 1 giây)
          rclone backend copyid mydrive: "$FILE_ID" "Bypass_Temp_Folder" --drive-server-side-across-configs

          echo "Trích xuất ID của file mới vừa được tạo bản sao..."
          MY_FILE_ID=$(rclone lsf mydrive:Bypass_Temp_Folder --format "id" | head -n 1)

          if [ -z "$MY_FILE_ID" ]; then
            echo "❌ Lỗi: Tạo bản sao file thất bại. Vui lòng kiểm tra lại trạng thái bộ nhớ Drive cá nhân."
            exit 1
          fi

          echo "-> ID file sạch vừa tạo: $MY_FILE_ID"
          echo "=== TIẾN HÀNH TẢI FILE GỐC VỚI BĂNG THÔNG TỐI ĐA ==="
          
          # Tải trực tiếp file từ Drive của bạn bằng cú pháp gdown mới chuẩn, bỏ qua lỗi hạn mức lượt tải
          gdown "https://drive.google.com/uc?id=$MY_FILE_ID" -O "$FILE_NAME"

          echo "-------------------------------------------------------"
          echo "Dọn dẹp thư mục tạm trên Google Drive để giữ sạch bộ nhớ..."
          rclone purge mydrive:Bypass_Temp_Folder

          # Xóa các file nhật ký tạm trên Linux
          rm -f gdown_log.txt files_list.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
