name: Auto Find and Download Latest MyROM
on:
  workflow_dispatch:

jobs:
  download-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Folder and Get Latest File
        id: gdrive
        run: |
          set -e
          
          # ID thư mục từ link của bạn
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
          
          echo "=== ĐANG TẢI THƯ MỤC TỪ GOOGLE DRIVE ==="
          # Tạo một thư mục tạm để chứa dữ liệu tải về
          mkdir -p myrom_folder
          
          # Sử dụng cú pháp mới nhất của gdown dành cho Folder (Tự vượt 403 bằng Cookie giả lập)
          gdown --folder --id "$FOLDER_ID" -O myrom_folder --remaining-ok

          echo "=== TÌM KIẾM FILE MỚI NHẤT TRONG THƯ MỤC ==="
          cd myrom_folder
          
          # Sắp xếp các file theo thời gian chỉnh sửa (Mới nhất nằm cuối cùng)
          # Hoặc xếp theo tên nếu tên file chứa số phiên bản tăng dần (v1 -> v2 -> v3)
          # Ở đây lệnh ls -t sẽ xếp file MỚI NHẤT lên ĐẦU TIÊN
          FILE_NAME=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          
          # Nếu không tìm thấy file .zip, quét thử tất cả các định dạng file khác
          if [ -z "$FILE_NAME" ]; then
            FILE_NAME=$(ls -t | head -n 1)
          fi

          if [ -z "$FILE_NAME" ]; then
            echo "❌ Lỗi: Thư mục tải về trống rỗng!"
            exit 1
          fi

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ TÌM THẤY FILE MYROM MỚI NHẤT TRONG FOLDER:"
          echo "Tên file: $FILE_NAME"
          echo "Dung lượng: $(ls -lh "$FILE_NAME" | awk '{print $5}')"
          echo "-------------------------------------------------------"

          # Di chuyển file mới nhất ra thư mục gốc của project để các step sau xử lý
          mv "$FILE_NAME" ../
          cd ../

          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "File sẵn sàng xử lý: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
