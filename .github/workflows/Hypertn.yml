name: Test Find and Download First File
on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Parse Folder and Download First File
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE SỬ DỤNG GDOWN ==="
          
          # SỬA TẠI ĐÂY: Dùng lệnh timeout của Linux để chạy gdown trong 15 giây.
          # Cú pháp chuẩn mới: gdown --folder "URL" (không thêm cờ lạ)
          # Trong 15 giây đầu, gdown chắc chắn sẽ in xong danh sách cấu trúc cây thư mục (Retrieving/Processing) ra file log.
          timeout 15s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          echo "=== PHÂN TÍCH DANH SÁCH FILE THU ĐƯỢC ==="
          
          # Lọc ra các dòng chứa danh sách file thực tế mà gdown quét được
          grep "Processing file" gdown_log.txt > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Lỗi: Không thể trích xuất danh sách file từ log. Dưới đây là log thô để debug:"
            cat gdown_log.txt
            exit 1
          fi

          echo "Danh sách các file tìm thấy trong thư mục:"
          cat files_list.txt

          # Lấy dòng đầu tiên (bản thấp nhất hoặc file nhẹ nhất) để test script theo ý bạn
          FIRST_LINE=$(head -n 1 files_list.txt)
          
          # Định dạng dòng log: Processing file ID_FILE NAME_FILE
          # Tách lấy ID (cột số 3) và Tên file (từ cột số 4 trở đi)
          FILE_ID=$(echo "$FIRST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$FIRST_LINE" | cut -d' ' -f4-)

          echo "-------------------------------------------------------"
          echo "🎯 ĐÃ BỐC ĐƯỢC FILE ĐẦU TIÊN ĐỂ THỬ NGHIỆM:"
          echo "Tên file: $FILE_NAME"
          echo "ID File: $FILE_ID"
          echo "-------------------------------------------------------"

          echo "=== TIẾN HÀNH TẢI FILE TIÊU CHUẨN ==="
          # Tải duy nhất file này bằng curl qua cổng uc download truyền thống
          curl -L -o "$FILE_NAME" "https://drive.google.com/uc?export=download&id=$FILE_ID"

          rm -f gdown_log.txt files_list.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
