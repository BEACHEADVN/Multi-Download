name: Auto Find and Upload Latest ROM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:

  # ================= MYROM =================
  myrom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: git pull origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y curl jq
          curl https://rclone.org/install.sh | sudo bash

      - name: Find latest MyROM
        id: gdrive
        run: |
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          timeout 20s gdown --folder \
          "https://drive.google.com/drive/folders/$FOLDER_ID" > log.txt || true

          grep "Processing file" log.txt | grep "\.7z" | grep -i "myrom" > files.txt || true

          [ -s files.txt ] || exit 1

          LINE=$(tail -n 1 files.txt)
          FILE=$(echo "$LINE" | cut -d' ' -f4-)

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Check state
        id: check
        run: |
          touch myrom_uploaded.txt

          if grep -Fq "${{ steps.gdrive.outputs.file }}|" myrom_uploaded.txt; then
            ID=$(grep -F "${{ steps.gdrive.outputs.file }}|" myrom_uploaded.txt | cut -d'|' -f2)

            OK=$(curl -s https://pixeldrain.com/api/file/$ID/info | jq -r '.success')

            [ "$OK" = "true" ] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Upload Save
        if: steps.check.outputs.skip != 'true'
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

          rclone copy source_rom:/ . \
            --include "$FILE" \
            --drive-acknowledge-abuse

          ID=$(curl -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file | jq -r '.id')

          LINK="https://pixeldrain.com/u/$ID"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="<b>🚀 New MyROM Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>" \
            -d parse_mode="HTML"

          sed -i "\|^$FILE|d" myrom_uploaded.txt
          echo "$FILE|$ID" >> myrom_uploaded.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add myrom_uploaded.txt
          git commit -m "Update MyROM" || true
          git pull --rebase origin main
          git push


  # ================= SOCRATES =================
  socrates:
    needs: myrom
    runs-on: ubuntu-latest

    steps:
