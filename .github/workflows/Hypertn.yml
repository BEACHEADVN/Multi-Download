name: Auto Find and Upload Latest ROM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  download-rom:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rom:
          - name: myrom
            pattern: "myrom"
            folder: "1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
            state: "myrom_uploaded.txt"

          - name: socrates
            pattern: "socrates"
            folder: "1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"
            state: "socrates_uploaded.txt"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      # ===== FIND LATEST =====
      - name: Parse Folder and Find Latest
        id: gdrive
        run: |
          set -e

          FOLDER_ID="${{ matrix.rom.folder }}"
          PATTERN="${{ matrix.rom.pattern }}"

          echo "=== Scan Google Drive ==="

          timeout 20s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          grep "Processing file" gdown_log.txt \
            | grep "\.7z" \
            | grep -i "$PATTERN" \
            > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Không tìm thấy file $PATTERN"
            exit 1
          fi

          echo "=== Found ==="
          cat files_list.txt

          LATEST_LINE=$(tail -n 1 files_list.txt)

          FILE_ID=$(echo "$LATEST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$LATEST_LINE" | cut -d' ' -f4-)

          echo "Latest: $FILE_NAME"

          echo "file=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "id=$FILE_ID" >> $GITHUB_OUTPUT

      # ===== CHECK STATE =====
      - name: Check Uploaded State
        id: check
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          STATE_FILE="${{ matrix.rom.state }}"

          touch "$STATE_FILE"

          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | head -n1 | cut -d'|' -f2)

            RESPONSE=$(curl -s "https://pixeldrain.com/api/file/$ID/info")
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

            if [ "$SUCCESS" = "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Already uploaded"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ===== DOWNLOAD =====
      - name: Download ROM
        if: steps.check.outputs.skip != 'true'
        run: |
          FILE_NAME="${{ steps.gdrive.outputs.file }}"
          FOLDER_ID="${{ matrix.rom.folder }}"

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"1//0gxkAzf3McJ0dCgYIARAAGBASNwF-L9IrTNIJoOImEdRjySNs2c9AdTZu_jAsfFwGMSwCmNTJr9I0a4oMhziH0CnMnQtfAoQoB4s","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

          rclone copy source_rom:/ . \
            --include "$FILE_NAME" \
            --drive-acknowledge-abuse \
            --progress

      # ===== VERIFY =====
      - name: Verify Download
        if: steps.check.outputs.skip != 'true'
        run: |
          ls -lh "${{ steps.gdrive.outputs.file }}"

      # ===== UPLOAD PIXELDRAIN =====
      - name: Upload to Pixeldrain
        if: steps.check.outputs.skip != 'true'
        id: pd
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"

          RESPONSE=$(curl -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$ID" = "null" ] || [ -z "$ID" ]; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT

      # ===== TELEGRAM =====
      - name: Send Telegram Notification
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ steps.gdrive.outputs.file }}"
          LINK="${{ steps.pd.outputs.link }}"
          ROM="${{ matrix.rom.name }}"

          TEXT="<b>🚀 New ${ROM} Uploaded!</b>%0A%0A📦 File: <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      # ===== SAVE STATE =====
      - name: Save State and Push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="${{ steps.gdrive.outputs.file }}"
          ID="${{ steps.pd.outputs.id }}"
          STATE_FILE="${{ matrix.rom.state }}"

          sed -i "\|^$FILE|d" "$STATE_FILE"
          echo "$FILE|$ID" >> "$STATE_FILE"

          git add "$STATE_FILE"
          git commit -m "Update ${{ matrix.rom.name }}: $FILE" || exit 0

          git pull --rebase origin main
          git push origin main
