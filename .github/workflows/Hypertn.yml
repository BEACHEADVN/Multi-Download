name: Test Find and Download First Valid File
on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Latest gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Parse Folder and Download First Valid File
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE SỬ DỤNG GDOWN ==="
          # Giới hạn gdown chạy trong 15 giây để in danh sách file ra log
          timeout 15s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          echo "=== PHÂN TÍCH DANH SÁCH FILE THU ĐƯỢC ==="
          # Lọc các dòng chứa file thực tế từ log thô
          grep "Processing file" gdown_log.txt > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "❌ Lỗi: Không thể trích xuất danh sách file từ log. Dưới đây là log thô để debug:"
            cat gdown_log.txt
            exit 1
          fi

          echo "Danh sách các file tìm thấy trong thư mục:"
          cat files_list.txt
          echo "-------------------------------------------------------"

          DOWNLOADED_SUCCESS=false
          FINAL_FILE_NAME=""

          # Đọc từng dòng trong danh sách file để tìm file có thể tải được
          while IFS= read -r line || [ -n "$line" ]; do
            # Tách lấy ID và Tên file từ log của gdown
            FILE_ID=$(echo "$line" | awk '{print $3}')
            FILE_NAME=$(echo "$line" | cut -d' ' -f4-)

            # Bỏ qua nếu là file Readme.md hoặc file cấu hình không cần thiết
            if [[ "$FILE_NAME" == *"Readme"* || "$FILE_NAME" == *.md ]]; then
              continue
            fi

            echo "🎯 Thử tải file: $FILE_NAME (ID: $FILE_ID)"
            
            # Tiến hành tải bằng cú pháp gdown chuẩn mới (không dùng tham số --id lỗi)
            if gdown "https://drive.google.com/uc?id=$FILE_ID" -O "$FILE_NAME"; then
              
              # Kiểm tra dung lượng thực tế sau khi tải (yêu cầu lớn hơn 100KB để loại trừ file HTML 2.5K lỗi)
              FILE_SIZE=$(stat -c%s "$FILE_NAME" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 102400 ]; then
                echo "✅ Tải thành công file gốc hợp lệ! Dung lượng: $(ls -lh "$FILE_NAME" | awk '{print $5}')"
                DOWNLOADED_SUCCESS=true
                FINAL_FILE_NAME="$FILE_NAME"
                break
              else
                echo "⚠️ Cảnh báo: File tải về quá nhỏ ($FILE_SIZE bytes), có thể bị dính trang HTML chặn quota của Google. Đang xóa và thử file khác..."
                rm -f "$FILE_NAME"
              fi
            else
              echo "❌ gdown thất bại khi tải ID này. Đang thử file tiếp theo..."
            fi
            echo "-------------------------------------------------------"
          done < files_list.txt

          # Kiểm tra nếu duyệt hết danh sách mà không tải được file nào
          if [ "$DOWNLOADED_SUCCESS" = false ]; then
            echo "❌ Thất bại: Tất cả các file trong thư mục đều bị Google Drive chặn giới hạn lượt tải (Quota Exceeded) hoặc lỗi!"
            exit 1
          fi

          # Dọn dẹp file tạm
          rm -f gdown_log.txt files_list.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FINAL_FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
