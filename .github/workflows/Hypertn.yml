name: Auto Find and Download Latest MyROM (Bypass Quota)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y jq curl
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      - name: Parse Folder and Download Latest ROM
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== SCAN GOOGLE DRIVE FOLDER ==="
          timeout 20s gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" > gdown_log.txt || true

          grep "Processing file" gdown_log.txt | grep "\.7z" > files_list.txt || true

          if [ ! -s files_list.txt ]; then
            echo "Không tìm thấy ROM"
            exit 1
          fi

          echo "=== FILES FOUND ==="
          cat files_list.txt

          LATEST_LINE=$(tail -n 1 files_list.txt)

          FILE_ID=$(echo "$LATEST_LINE" | awk '{print $3}')
          FILE_NAME=$(echo "$LATEST_LINE" | cut -d' ' -f4-)

          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

          echo "=== LATEST ==="
          echo "$FILE_NAME"

          export RCLONE_CONFIG_MYDRIVE_TYPE="drive"
          export RCLONE_CONFIG_MYDRIVE_SCOPE="drive"
          export RCLONE_CONFIG_MYDRIVE_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"YOUR_REFRESH_TOKEN","expiry":"2000-01-01T00:00:00Z"}'

          export RCLONE_CONFIG_SOURCE_ROM_TYPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_SCOPE="drive"
          export RCLONE_CONFIG_SOURCE_ROM_TOKEN='{"access_token":"","token_type":"Bearer","refresh_token":"YOUR_REFRESH_TOKEN","expiry":"2000-01-01T00:00:00Z"}'
          export RCLONE_CONFIG_SOURCE_ROM_ROOT_FOLDER_ID="$FOLDER_ID"

          echo "=== SERVER SIDE COPY (BYPASS QUOTA) ==="
          rclone copy source_rom:/ mydrive:/ \
            --include "$FILE_NAME" \
            --drive-server-side-across-configs \
            --progress

          echo "=== DOWNLOAD TO RUNNER ==="
          rclone copy mydrive:/ . \
            --include "$FILE_NAME" \
            --progress

          echo "=== CLEANUP DRIVE COPY ==="
          rclone deletefile "mydrive:/$FILE_NAME"

          rm -f gdown_log.txt files_list.txt

      - name: Verify Download
        run: |
          ls -lh "${{ steps.gdrive.outputs.filename }}"

      - name: Check Uploaded State
        id: check
        run: |
          FILE="${{ steps.gdrive.outputs.filename }}"
          STATE_FILE="rom_uploaded.txt"
          touch $STATE_FILE

          if grep -Fq "$FILE|" "$STATE_FILE"; then
            ID=$(grep -F "$FILE|" "$STATE_FILE" | head -n1 | cut -d '|' -f2)

            RESPONSE=$(curl -s "https://pixeldrain.com/api/file/$ID/info")
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

            if [ "$SUCCESS" = "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Upload to Pixeldrain
        if: steps.check.outputs.skip != 'true'
        id: pd
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ steps.gdrive.outputs.filename }}"

          RESPONSE=$(curl -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ steps.gdrive.outputs.filename }}"
          LINK="${{ steps.pd.outputs.link }}"

          TEXT="<b>🚀 New ROM Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      - name: Save State and Push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="${{ steps.gdrive.outputs.filename }}"
          ID="${{ steps.pd.outputs.id }}"
          STATE_FILE="rom_uploaded.txt"

          touch $STATE_FILE
          sed -i "\|^$FILE|d" "$STATE_FILE"

          echo "$FILE|$ID" >> "$STATE_FILE"

          git add "$STATE_FILE"
          git commit -m "Update ROM: $FILE" || exit 0

          git pull --rebase origin main
          git push
