name: Test Find and Download First File
on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Parse Google Drive and Get First File
        id: gdrive
        run: |
          set -e

          FOLDER_ID="1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m"

          echo "=== ĐANG QUÉT DANH SÁCH FILE TỪ GOOGLE DRIVE ==="
          
          python -c "
          import urllib.request
          import re
          import sys

          folder_id = '1gJOuHLm6llki5bRYMRqVC0NbFJYDuZ8m'
          # Chuyển sang cào trang giao diện gốc - nơi chứa cục dữ liệu JSON tổng mà gdown hay dùng
          url = f'https://drive.google.com/drive/folders/{folder_id}'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})
          
          try:
              html = urllib.request.urlopen(req).read().decode('utf-8')
              
              # Sử dụng Regex bốc cấu trúc ID và Tên file nằm trong cục dữ liệu của trang Drive gốc
              # Cấu trúc này quét được cả ID file lẫn tên file dạng chuỗi JSON
              matches = re.findall(r'\[\"([a-zA-Z0-9_-]{28,35})\"\,\"([^\"]+\.(?:7z|zip|rar|bin|md))\"', html)
              
              if not matches:
                  # Backup Regex: Tìm phòng hờ nếu cấu trúc JSON dạng dấu nháy khác
                  matches = re.findall(r'\"([a-zA-Z0-9_-]{28,35})\"\,\"([^\"]+\.(?:7z|zip|rar|bin|md))\"', html)

              if not matches:
                  print('ERROR: Không tìm thấy dữ liệu file nào! Google đã thay đổi cấu trúc hiển thị.')
                  sys.exit(1)
              
              # Lọc trùng lặp và sắp xếp bảng chữ cái
              unique_files = sorted(list(set(matches)), key=lambda x: x[1])
              
              # Bốc file đầu tiên [0] để test thử xem script chạy thông không
              test_file = unique_files[0]
              
              print('-------------------------------------------------------')
              print('🎯 ĐÃ BỐC THÀNH CÔNG FILE ĐẦU TIÊN QUA TRANG GỐC:')
              print(f'Tên file: {test_file[1]}')
              print(f'ID File: {test_file[0]}')
              print('-------------------------------------------------------')
              
              with open('target_file.txt', 'w', encoding='utf-8') as f:
                  f.write(f'{test_file[0]}|{test_file[1]}')
          except Exception as e:
              print(f'Lỗi cào dữ liệu trang gốc: {e}')
              sys.exit(1)
          "

          # Đọc thông tin file thu được
          LATEST_INFO=$(cat target_file.txt)
          FILE_ID=$(echo "$LATEST_INFO" | cut -d'|' -f1)
          FILE_NAME=$(echo "$LATEST_INFO" | cut -d'|' -f2)

          echo "=== TIẾN HÀNH TẢI FILE TIÊU CHUẨN ==="
          # Tải file qua link xuất bản trực tiếp của Google Drive
          curl -L -o "$FILE_NAME" "https://drive.google.com/uc?export=download&id=$FILE_ID"

          rm -f target_file.txt
          
          echo "Lưu đầu ra vào hệ thống..."
          echo "filename=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Verify Downloaded File
        run: |
          echo "Kiểm tra file đã tải xuống thành công:"
          echo "Tên file: ${{ steps.gdrive.outputs.filename }}"
          ls -lh "${{ steps.gdrive.outputs.filename }}"
