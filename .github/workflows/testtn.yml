name: HyperTN Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ===== INSTALL PLAYWRIGHT =====
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # ===== GET ROM URL =====
      - name: Get latest MYRON ROM
        run: |
          cat > get_rom.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            await page.goto('https://www.hypertn.io.vn/download', {
              waitUntil: 'networkidle'
            });

            await page.locator('.card').filter({
              hasText: 'MYRON'
            }).click();

            await page.waitForLoadState('networkidle');

            const links = await page.$$eval('a', els =>
              els.map(a => a.href)
                .filter(h => h.includes('hypertn.koyeb.app/d/ROM'))
            );

            links.sort((a, b) => {
              const da = (a.match(/_(\d{8})\.7z$/) || [,'0'])[1];
              const db = (b.match(/_(\d{8})\.7z$/) || [,'0'])[1];
              return db.localeCompare(da);
            });

            fs.writeFileSync('rom_url.txt', links[0] || '');

            await browser.close();
          })();
          EOF

          node get_rom.js

      # ===== DOWNLOAD ROM =====
      - name: Download ROM
        run: |
          URL=$(cat rom_url.txt)

          if [ -z "$URL" ]; then
            echo "No URL found"
            exit 1
          fi

          wget -O rom.7z "$URL"

      # ===== INSTALL 7ZIP =====
      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq curl

      # ===== CHECK FILE =====
      - name: Check file
        id: check
        run: |
          FILE="rom.7z"

          if [ ! -f "$FILE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ===== SPLIT LARGE FILE =====
      - name: Split Large File
        id: split
        if: steps.check.outputs.skip != 'true'
        run: |
          FILE="rom.7z"

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "File > 9GB, splitting..."

            7z a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE"
            echo "split=true" >> $GITHUB_OUTPUT
          else
            echo "split=false" >> $GITHUB_OUTPUT
          fi

      # ===== UPLOAD PIXELDRAIN =====
      - name: Upload to Pixeldrain
        id: pd
        if: steps.check.outputs.skip != 'true'
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="rom.7z"

          if [ "${{ steps.split.outputs.split }}" = "true" ]; then

            IDS=""

            for PART in *.7z.*; do
              echo "Uploading $PART"

              RESPONSE=$(curl -s -u ":$PD_API_KEY" \
                -F "file=@${PART}" \
                https://pixeldrain.com/api/file)

              ID=$(echo "$RESPONSE" | jq -r '.id')

              if [ "$ID" = "null" ] || [ -z "$ID" ]; then
                echo "$RESPONSE"
                exit 1
              fi

              IDS="${IDS},$ID"
            done

            IDS=${IDS#,}
            echo "ids=$IDS" >> $GITHUB_OUTPUT

            # link chỉ lấy part đầu
            FIRST_ID=$(echo "$IDS" | cut -d',' -f1)
            echo "link=https://pixeldrain.com/u/$FIRST_ID" >> $GITHUB_OUTPUT

          else

            RESPONSE=$(curl -s -u ":$PD_API_KEY" \
              -F "file=@${FILE}" \
              https://pixeldrain.com/api/file)

            ID=$(echo "$RESPONSE" | jq -r '.id')

            if [ "$ID" = "null" ] || [ -z "$ID" ]; then
              echo "$RESPONSE"
              exit 1
            fi

            echo "ids=$ID" >> $GITHUB_OUTPUT
            echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT
          fi

      # ===== TELEGRAM NOTIFY =====
      - name: Telegram Notify
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="rom.7z"
          LINK="${{ steps.pd.outputs.link }}"

          TEXT="<b>🚀 HyperTN MYRON ROM Uploaded!</b>%0A%0A📦 <code>$FILE</code>%0A🔗 <a href=\"$LINK\">Download</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      # ===== SAVE STATE =====
      - name: Save State
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="rom.7z"
          IDS="${{ steps.pd.outputs.ids }}"

          for i in {1..10}; do
            git fetch origin main
            git reset --hard origin/main

            touch rom_uploaded.txt
            sed -i "\|^$FILE|d" rom_uploaded.txt
            echo "$FILE|$IDS" >> rom_uploaded.txt

            sort -u rom_uploaded.txt -o rom_uploaded.txt

            git add rom_uploaded.txt
            git commit -m "Update MYRON: $FILE" || true

            if git push origin main; then
              exit 0
            fi

            sleep 3
          done

          exit 1
