name: HyperTN Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ===== NODE =====
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ===== PLAYWRIGHT =====
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # ===== GET ROM INFO =====
      - name: Get latest MYRON ROM
        run: |
          cat > get_rom.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            await page.goto('https://www.hypertn.io.vn/download', {
              waitUntil: 'networkidle'
            });

            await page.locator('.card').filter({
              hasText: 'MYRON'
            }).first().click();

            await page.waitForTimeout(5000);

            const links = await page.evaluate(() => {
              return Array.from(document.querySelectorAll('a'))
                .map(a => a.href)
                .filter(h => h && h.includes('hypertn.koyeb.app/d/ROM'));
            });

            if (!links.length) {
              console.log("No links found");
              process.exit(1);
            }

            links.sort((a, b) => {
              const da = (a.match(/_(\d{8})\.7z$/) || ['','0'])[1];
              const db = (b.match(/_(\d{8})\.7z$/) || ['','0'])[1];
              return db.localeCompare(da);
            });

            const url = links[0];
            const name = url.split('/').pop().replace('.7z', '');

            fs.writeFileSync('rom_url.txt', url);
            fs.writeFileSync('rom_name.txt', name);

            await browser.close();
          })();
          EOF

          node get_rom.js

      # ===== CHECK HISTORY & CLEANUP DEAD LINKS (FIXED) =====
      - name: Check Duplicate and Pixeldrain Status
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(cat rom_url.txt)
          NAME=$(cat rom_name.txt)
          FILE="${NAME}.7z"
          echo "FILE=$FILE" >> $GITHUB_ENV

          touch rom_uploaded.txt
          
          # Lấy ID cũ từ file rom_uploaded.txt (nếu có)
          OLD_ID=$(grep "^${FILE}|" rom_uploaded.txt | cut -d'|' -f2)

          if [ -n "$OLD_ID" ]; then
            echo "🔎 Tìm thấy lịch sử với Pixeldrain ID: $OLD_ID"
            echo "⚡ Đang kiểm tra trạng thái file trên Pixeldrain..."
            
            PD_CHECK=$(curl -s "https://pixeldrain.com/api/file/${OLD_ID}/info")
            PD_STATUS=$(echo "$PD_CHECK" | jq -r '.success')

            if [ "$PD_STATUS" = "true" ]; then
              echo "✅ File vẫn còn tồn tại trên Pixeldrain. Bỏ qua toàn bộ!"
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "ids=$OLD_ID" >> $GITHUB_OUTPUT
              echo "link=https://pixeldrain.com/u/$OLD_ID" >> $GITHUB_OUTPUT
            else
              echo "❌ File ĐÃ BỊ XÓA trên Pixeldrain. Tiến hành xóa dòng lỗi trong lịch sử và chuẩn bị tải lại..."
              echo "skip=false" >> $GITHUB_OUTPUT

              # Tiến hành xóa dòng chết ngay lập tức và đẩy lên Git để chặn các runner sau đọc nhầm
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              for i in {1..5}; do
                git fetch origin main
                git reset --hard origin/main
                
                # Xóa dòng cũ dựa trên tên file chính xác (tránh lỗi ký tự đặc biệt bằng cách dùng dấu @ thay vì / trong sed)
                sed -i "\|^${FILE}|d" rom_uploaded.txt
                
                git add rom_uploaded.txt
                git commit -m "Cleanup dead Pixeldrain link for: $FILE" || true
                git push https://x-access-token:${GITHUB_TOKEN}@github.com/BEACHEADVN/Multi-Download.git main && break
                sleep 3
              done
            fi
          else
            echo "🆕 ROM mới hoàn toàn, chưa từng được ghi nhận."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ===== DOWNLOAD =====
      - name: Download ROM
        if: steps.check.outputs.skip != 'true'
        run: |
          URL=$(cat rom_url.txt)
          wget -O "${{ env.FILE }}" "$URL"

      # ===== TOOLS =====
      - name: Install tools
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq curl

      # ===== SPLIT LARGE FILE =====
      - name: Split Large File
        id: split
        if: steps.check.outputs.skip != 'true'
        run: |
          FILE="${{ env.FILE }}"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          if [ "$SIZE" -gt "$LIMIT" ]; then
            7z a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE"
            echo "split=true" >> $GITHUB_OUTPUT
          else
            echo "split=false" >> $GITHUB_OUTPUT
          fi

      # ===== PIXELDRAIN BACKUP =====
      - name: Upload to Pixeldrain
        id: pd
        if: steps.check.outputs.skip != 'true'
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ env.FILE }}"

          RESPONSE=$(curl -s -u ":$PD_API_KEY" \
            -F "file=@${FILE}" \
            https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "ids=$ID" >> $GITHUB_OUTPUT
          echo "link=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT

      # ===== TELEGRAM (2 LINKS) =====
      - name: Telegram Notify
        if: steps.check.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="${{ env.FILE }}"
          HYPERTN=$(cat rom_url.txt)
          PIXEL="${{ steps.pd.outputs.link || steps.check.outputs.link }}"

          TEXT="<b>🚀 HyperTN MYRON ROM</b>%0A%0A📦 <code>$FILE</code>%0A%0A🔗 <b>HyperTN:</b> <a href=\"$HYPERTN\">Direct Download</a>%0A💾 <b>Pixeldrain:</b> <a href=\"$PIXEL\">Mirror Link</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT" \
            -d parse_mode="HTML"

      # ===== SAVE STATE =====
      - name: Save State
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          FILE="${{ env.FILE }}"
          IDS="${{ steps.pd.outputs.ids }}"
      
          for i in {1..10}; do
            git fetch origin main
            git reset --hard origin/main
      
            touch rom_uploaded.txt
      
            # Xóa dòng cũ (để chắc chắn không bị trùng lặp)
            sed -i "\|^${FILE}|d" rom_uploaded.txt
      
            # Thêm dòng mới kèm ID vừa tạo thành công
            echo "$FILE|$IDS" >> rom_uploaded.txt
      
            # Sắp xếp lại file
            sort -t'|' -k1,1 rom_uploaded.txt -o rom_uploaded.txt
      
            git add rom_uploaded.txt
            git commit -m "Update MYRON: $FILE" || true
      
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/BEACHEADVN/Multi-Download.git main && exit 0
      
            sleep 3
          done
      
          exit
